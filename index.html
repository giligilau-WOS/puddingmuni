<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="學習面板">
<link rel="apple-touch-icon-precomposed" href="https://giligilau-wos.github.io/puddingmuni/apple-touch-icon-precomposed.png">
<link rel="apple-touch-icon" href="https://giligilau-wos.github.io/puddingmuni/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=kid1">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=kid1">
<title>學習面板</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang TC", "Heiti TC", sans-serif;
    background: #eef1f5; color: #1f2933; font-size: 17px;
    -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0); -webkit-text-size-adjust: 100%;
  }
  [data-act] { cursor: pointer; touch-action: manipulation; }

  #app { display: flex; flex-direction: column; height: 100%; }
  #top {
    height: 60px; flex-shrink: 0; display: flex; align-items: center;
    padding: 0 12px; background: #fff; border-bottom: 1px solid #d9dee5;
  }
  #time { font-size: 38px; font-weight: bold; margin-right: 10px; }
  #date { font-size: 17px; color: #52606d; }
  #exam { flex: 1; text-align: center; font-size: 20px; font-weight: bold; }
  .e-green { color: #2b8a3e; } .e-orange { color: #e8590c; } .e-red { color: #c92a2a; }
  #syncInfo { font-size: 13px; color: #7b8794; margin-right: 4px; max-width: 230px; overflow: hidden; white-space: nowrap; }
  .tbtn {
    display: flex; align-items: center; justify-content: center; height: 38px; padding: 0 12px; margin-left: 6px;
    border-radius: 8px; background: #e4e7eb; font-size: 16px; line-height: 1; white-space: nowrap;
  }

  #main { flex: 1; display: flex; min-height: 0; padding: 3px; }
  .col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .card {
    flex: 1; min-height: 0; margin: 4px; background: #fff; border-radius: 12px;
    padding: 9px 12px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #d9dee5;
  }
  .card h2 { margin: 0 0 6px; font-size: 19px; flex-shrink: 0; }
  .card h3 { margin: 8px 0 4px; font-size: 16px; color: #52606d; flex-shrink: 0; }
  .empty { color: #9aa5b1; padding: 10px 0; }
  .bar { height: 12px; background: #e4e7eb; border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #f59f00; }

  /* 任務 */
  .starbar { background: #fff4e6; border-radius: 10px; padding: 6px 10px; margin-bottom: 4px; flex-shrink: 0; }
  .sbtop { display: flex; align-items: baseline; margin-bottom: 4px; }
  .sbnum { font-size: 24px; font-weight: bold; color: #e8590c; margin-right: 10px; flex-shrink: 0; white-space: nowrap; }
  .sbgoal { font-size: 15px; color: #7b8794; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .task { display: flex; align-items: center; padding: 9px 4px; border-bottom: 1px solid #eef1f5; font-size: 20px; }
  .box {
    width: 30px; height: 30px; flex-shrink: 0; border: 3px solid #9aa5b1; border-radius: 7px;
    margin-right: 12px; display: flex; align-items: center; justify-content: center; line-height: 1; font-size: 20px; color: #fff;
  }
  .task.done .box { background: #2f9e44; border-color: #2f9e44; }
  .task.done .tname { color: #9aa5b1; text-decoration: line-through; }
  .tname { flex: 1; }
  .tstar { color: #e8590c; font-size: 16px; margin-left: 8px; }

  /* 蕃茄鐘 */
  .pmsg { text-align: center; color: #52606d; flex-shrink: 0; line-height: 1.3; white-space: nowrap; overflow: hidden; }
  #pomoTime { font-size: 60px; font-weight: bold; text-align: center; line-height: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; }
  .pbar { margin: 4px 6px 8px; flex-shrink: 0; }
  #pwrap { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #pwrap.stack { flex-direction: column; }
  #pwrap.stack #pomoTime.ptime-side { margin: 4px 0 0; }
  .tom-bg { fill: #ffe3e3; stroke: #fa5252; stroke-width: 4; }
  .tom-fill { fill: #fa5252; }
  .tom-fill.rest { fill: #fab005; }
  .tom-shine { fill: #fff; opacity: 0.35; }
  .tom-leaf { fill: #40c057; }
  .hg-glass { fill: #f1f3f5; stroke: #adb5bd; stroke-width: 3; stroke-linejoin: round; }
  .hg-sand { fill: #f59f00; }
  .hg-sand.rest { fill: #40c057; }
  .hg-stream { stroke: #f59f00; stroke-width: 3; stroke-dasharray: 4 4; }
  .hg-stream.rest { stroke: #40c057; }
  .hg-wood { fill: #a9784d; }
  .bat-shell { fill: #f8f9fa; stroke: #495057; stroke-width: 5; }
  .bat-nub { fill: #495057; }
  .seg { fill: #e9ecef; }
  .seg.on { fill: #40c057; }
  .seg.on.mid { fill: #fab005; }
  .seg.on.low { fill: #fa5252; }
  body.th-space .tom-bg, body.th-space .hg-glass, body.th-space .bat-shell { fill: #3d3290; }
  body.th-space .seg { fill: #2a2266; }
  body.th-space .bat-shell, body.th-space .bat-nub { stroke: #c5bdf5; }
  body.th-space .bat-nub { fill: #c5bdf5; }

  /* ===== 直立版面（iPad 直放） ===== */
  body.L-tall #top { height: auto; min-height: 60px; flex-wrap: wrap; padding: 6px 10px; }
  body.L-tall #exam { -webkit-order: 9; order: 9; width: 100%; flex: none; padding: 2px 0 4px; }
  body.L-tall #syncInfo { max-width: 120px; margin-left: 8px; }
  body.L-tall .tbtn { padding: 0 9px; margin-left: 5px; }
  body.L-tall .pbtn, body.L-narrow .pbtn { font-size: 15px; margin: 0 2px; }
  body.L-tall .mbtn { font-size: 16px; }

  /* ===== 小螢幕（手機）：一張一張往下排，可以捲動 ===== */
  html.scroll, html.scroll body { height: auto; overflow: auto; }
  body.L-narrow #app { height: auto; }
  body.L-narrow #top { height: auto; flex-wrap: wrap; padding: 6px 8px; }
  body.L-narrow #time { font-size: 30px; }
  body.L-narrow #exam { -webkit-order: 9; order: 9; width: 100%; flex: none; font-size: 17px; padding: 2px 0 4px; }
  body.L-narrow #syncInfo { display: none; }
  body.L-narrow .tbtn { height: 34px; padding: 0 8px; margin: 3px 0 3px 5px; font-size: 14px; }
  body.L-narrow #main { display: block; }
  body.L-narrow .col { display: block; }
  body.L-narrow .card { display: flex; min-height: 0; margin: 6px; }
  body.L-narrow #cTasks, body.L-narrow #cSched { min-height: 260px; }
  body.L-narrow #cPomo { height: 330px; }
  body.L-narrow #cMoney { height: 300px; }
  body.L-narrow .list, body.L-narrow .sbody { overflow: visible; }
  body.L-narrow #ovBox { width: 94%; margin-left: -47%; }
  body.L-narrow #toast { width: 90%; margin-left: -45%; }
  #pwrap svg { flex-shrink: 0; display: block; }
  #pomoTime.ptime-side { margin-left: 16px; }
  .ringbox { position: relative; }
  #pomoTime.ptime-in { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }
  .dial-bg { fill: #f1f3f5; stroke: #dee2e6; stroke-width: 2; }
  .tick { stroke: #adb5bd; stroke-width: 3; }
  .pie-fill { fill: #fa5252; }
  .pie-fill.rest, .ring-fg.rest { fill: #40c057; stroke: #40c057; }
  .ring-fg.rest { fill: none; }
  .dial-c { fill: #495057; }
  .ring-bg { fill: none; stroke: #e9ecef; stroke-width: 18; }
  .ring-fg { fill: none; stroke: #fa5252; stroke-width: 18; stroke-linecap: round; }
  body.th-space .dial-bg { fill: #3d3290; stroke: #5a4bb5; }
  body.th-space .ring-bg { stroke: #3d3290; }
  body.th-space .pie-fill { fill: #ffd43b; }
  body.th-space .ring-fg { stroke: #ffd43b; }
  body.th-candy .pie-fill { fill: #f06595; } body.th-candy .ring-fg { stroke: #f06595; }
  body.th-ocean .pie-fill { fill: #29b6f6; } body.th-ocean .ring-fg { stroke: #29b6f6; }
  body.th-forest .pie-fill { fill: #7cb342; } body.th-forest .ring-fg { stroke: #7cb342; }
  body.th-candy .pie-fill.rest, body.th-ocean .pie-fill.rest, body.th-forest .pie-fill.rest, body.th-space .pie-fill.rest { fill: #40c057; }
  body.th-candy .ring-fg.rest, body.th-ocean .ring-fg.rest, body.th-forest .ring-fg.rest, body.th-space .ring-fg.rest { stroke: #40c057; }
  .pbar i { background: #1971c2; }
  .prow { display: flex; flex-shrink: 0; margin-top: auto; }
  .pbtn {
    flex: 1; display: flex; align-items: center; justify-content: center; height: 50px; margin: 0 4px;
    border-radius: 10px; background: #1971c2; color: #fff; font-size: 18px; line-height: 1; white-space: nowrap;
  }
  .pbtn.rest { background: #2f9e44; }
  .pbtn.stop { background: #c92a2a; }

  /* 課表 */
  .periods { display: flex; flex-wrap: wrap; }
  .sbody { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .ps { min-width: 0; white-space: normal; word-break: break-all; }
  /* 內容太多時自動縮小一級，讓整張課表放得下 */
  .sz1 .per { font-size: 20px; } .sz1 .item { font-size: 17px; min-height: 32px; } .sz1 .after, .sz1 .note { font-size: 17px; }
  .sz2 .per { font-size: 18px; padding-right: 10px; } .sz2 .per b { min-width: 26px; height: 26px; font-size: 14px; }
  .sz2 .item { font-size: 16px; min-height: 30px; padding: 3px 11px; } .sz2 .after, .sz2 .note { font-size: 16px; } .sz2 h3 { margin: 4px 0 2px; }
  .sz3 .per { font-size: 16px; margin: 2px 4px 2px 0; padding-right: 8px; } .sz3 .per b { min-width: 24px; height: 24px; font-size: 13px; margin-right: 5px; }
  .sz3 .item { font-size: 15px; min-height: 28px; padding: 2px 10px; margin: 2px; } .sz3 .after, .sz3 .note { font-size: 15px; margin-top: 2px; } .sz3 h3 { margin: 3px 0 1px; font-size: 14px; }
  .per {
    display: -webkit-inline-flex; display: inline-flex; align-items: center; max-width: 100%;
    margin: 3px 6px 3px 0; padding: 3px 12px 3px 3px; border-radius: 20px; background: rgba(0,0,0,0.04);
    font-size: 22px; line-height: 1.25;
  }
  .per.exam { color: #c92a2a; font-weight: bold; }
  .per.exam b { background: #ffe3e3 !important; color: #c92a2a !important; }
  .exband { background: #ffe3e3; color: #c92a2a; border-radius: 10px; padding: 4px 10px; margin-bottom: 4px; font-size: 17px; font-weight: bold; flex-shrink: 0; }
  .per b {
    display: -webkit-inline-flex; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    min-width: 30px; height: 30px; border-radius: 15px; background: #d0ebff;
    line-height: 1; font-size: 16px; margin-right: 8px; padding: 0 5px;
  }
  .after { margin-top: 4px; color: #5f3dc4; font-size: 19px; flex-shrink: 0; }
  .bag { }
  .item {
    display: -webkit-inline-flex; display: inline-flex; align-items: center; justify-content: center;
    min-height: 36px; margin: 3px; padding: 4px 14px; border-radius: 18px; background: #fff3bf; font-size: 19px; line-height: 1.2;
  }
  .item.ok { background: #d3f9d8; color: #2b8a3e; text-decoration: line-through; }
  .note { color: #c2255c; font-size: 18px; margin: 4px 3px; }

  /* 零用錢 */
  .mtop { display: flex; align-items: center; flex-shrink: 0; }
  #bal { font-size: 42px; font-weight: bold; color: #2b8a3e; margin-right: 14px; }
  .goal { flex: 1; font-size: 15px; color: #52606d; }
  .goal .bar { margin-top: 4px; }
  .goal .bar i { background: #2f9e44; }
  .recent { flex: 1; overflow: hidden; margin: 6px 0; }
  .rec { display: flex; font-size: 16px; padding: 4px 0; border-bottom: 1px solid #eef1f5; }
  .rec .rd { width: 52px; color: #9aa5b1; }
  .rec .rt { flex: 1; overflow: hidden; white-space: nowrap; }
  .rec .ra { width: 80px; text-align: right; font-weight: bold; }
  .plus { color: #2b8a3e; } .minus { color: #c92a2a; }
  .pend { font-size: 12px; color: #9aa5b1; }
  .mrow { display: flex; flex-shrink: 0; }
  .mbtn {
    flex: 1; display: flex; align-items: center; justify-content: center; height: 50px; margin: 0 4px;
    border-radius: 10px; color: #fff; font-size: 18px; line-height: 1; white-space: nowrap;
  }
  .mbtn.out { background: #e8590c; } .mbtn.in { background: #2f9e44; }

  /* 彈出視窗 */
  #ov { display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.45); z-index: 10; }
  #ovBox {
    position: absolute; left: 50%; top: 50%; width: 500px; margin-left: -250px;
    -webkit-transform: translateY(-50%); transform: translateY(-50%);
    background: #fff; border-radius: 14px; padding: 16px; max-height: 96%; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .ovh { display: flex; align-items: center; margin-bottom: 10px; }
  .ovh h2 { flex: 1; margin: 0; font-size: 21px; }
  .x { display: flex; align-items: center; justify-content: center; height: 38px; padding: 0 14px; border-radius: 8px; background: #e4e7eb; font-size: 17px; line-height: 1; }
  .amt { font-size: 44px; font-weight: bold; text-align: center; margin: 4px 0 8px; }
  .cats { display: flex; flex-wrap: wrap; margin-bottom: 8px; }
  .cat { display: -webkit-inline-flex; display: inline-flex; align-items: center; justify-content: center; height: 40px; margin: 3px; padding: 0 16px; border-radius: 20px; background: #e4e7eb; font-size: 17px; line-height: 1; }
  .cat.sel { background: #1971c2; color: #fff; }
  .keys { display: flex; flex-wrap: wrap; }
  .key { width: 33.33%; padding: 4px; }
  .key div { display: flex; align-items: center; justify-content: center; height: 56px; background: #e4e7eb; border-radius: 10px; font-size: 26px; line-height: 1; }
  .okbtn { display: flex; align-items: center; justify-content: center; height: 54px; margin: 10px 4px 0; border-radius: 10px; background: #1971c2; color: #fff; font-size: 20px; line-height: 1; }
  .dots { text-align: center; font-size: 34px; letter-spacing: 12px; margin: 6px 0; }
  .pinmsg { text-align: center; color: #c92a2a; height: 22px; }
  .rw { display: flex; align-items: center; padding: 10px 4px; border-bottom: 1px solid #eef1f5; font-size: 18px; }
  .rw .rn { flex: 1; }
  .rw .rs { color: #e8590c; margin-right: 10px; }
  .rbtn { display: flex; align-items: center; justify-content: center; height: 40px; padding: 0 14px; border-radius: 8px; background: #e8590c; color: #fff; line-height: 1; white-space: nowrap; }
  .rbtn.no { background: #cbd2d9; }

  #toast {
    display: none; position: fixed; left: 50%; bottom: 40px; width: 420px; margin-left: -210px; z-index: 20;
    background: rgba(31,41,51,0.92); color: #fff; text-align: center; font-size: 22px; padding: 14px; border-radius: 12px;
  }
  #errbar { display: none; position: fixed; left: 0; right: 0; bottom: 0; background: #ffe3e3; color: #c92a2a; font-size: 13px; padding: 4px 10px; z-index: 30; }

  /* 夜間模式：整個畫面蓋一層半透明黑，任何主題都適用 */
  #dim { display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); pointer-events: none; z-index: 40; }
  body.night #dim { display: block; }

  /* 可愛字型（檔案放在 fonts 資料夾） */
  body.f-kid, body.f-kid .x, body.f-kid .tbtn { font-family: "KidFont", -apple-system, "PingFang TC", "Heiti TC", sans-serif; }

  /* 卡片角落貼紙 */
  .card { position: relative; }
  .card::after { position: absolute; top: 4px; right: 8px; font-size: 26px; line-height: 1; pointer-events: none; }

  /* ===== 主題：糖果樂園 ===== */
  body.th-candy { background-color: #fff0f6; background-image: radial-gradient(#ffd6e7 18%, transparent 20%); background-size: 30px 30px; }
  body.th-candy #top { background: #ffdeeb; border-bottom: 4px dashed #f783ac; }
  body.th-candy .card { border: 4px dashed #f783ac; border-radius: 26px; background: #fffafc; }
  body.th-candy .card h2 { display: inline-block; align-self: flex-start; background: #ffdeeb; color: #c2255c; padding: 2px 16px; border-radius: 16px; }
  body.th-candy .tbtn { background: #fff; color: #c2255c; border-radius: 16px; }
  body.th-candy .pbtn, body.th-candy .okbtn { background: #f06595; border-radius: 22px; }
  body.th-candy .pbtn.rest { background: #74c0fc; }
  body.th-candy .mbtn, body.th-candy .rbtn { border-radius: 22px; }
  body.th-candy .pbar i { background: #f06595; }
  body.th-candy .per b { background: #ffdeeb; color: #c2255c; }
  body.th-candy #ovBox { border: 5px dashed #f783ac; border-radius: 26px; }
  body.th-candy #cTasks::after { content: "🍬"; }
  body.th-candy #cPomo::after { content: "🍓"; }
  body.th-candy #cSched::after { content: "🎀"; }
  body.th-candy #cMoney::after { content: "🍭"; }

  /* ===== 主題：森林探險 ===== */
  body.th-forest { background-color: #eef7e4; background-image: linear-gradient(45deg, #e2f0d3 25%, transparent 25%, transparent 75%, #e2f0d3 75%); background-size: 36px 36px; }
  body.th-forest #top { background: #dcedc8; border-bottom: 5px solid #8bc34a; }
  body.th-forest .card { border: 5px solid #8bc34a; border-top-width: 12px; border-radius: 20px; background: #fdfdf6; }
  body.th-forest .card h2 { color: #33691e; border-bottom: 3px dotted #aed581; padding-bottom: 3px; }
  body.th-forest .tbtn { background: #fff; color: #33691e; }
  body.th-forest .pbtn, body.th-forest .okbtn { background: #7cb342; }
  body.th-forest .pbtn.rest { background: #ffb300; }
  body.th-forest .pbar i { background: #7cb342; }
  body.th-forest .per b { background: #dcedc8; color: #33691e; }
  body.th-forest .item { background: #fff8e1; border: 2px solid #ffe082; }
  body.th-forest #ovBox { border: 6px solid #8bc34a; border-top-width: 14px; border-radius: 20px; }
  body.th-forest #cTasks::after { content: "🌼"; }
  body.th-forest #cPomo::after { content: "🐌"; }
  body.th-forest #cSched::after { content: "🌳"; }
  body.th-forest #cMoney::after { content: "🐰"; }

  /* ===== 主題：海洋世界 ===== */
  body.th-ocean { background-color: #e3f2fd; background-image: radial-gradient(circle, #cfe8fc 10px, transparent 11px), radial-gradient(circle, #d6ecfd 5px, transparent 6px); background-size: 90px 90px, 50px 50px; background-position: 0 0, 25px 35px; }
  body.th-ocean #top { background: #b3e5fc; border-bottom: 4px solid #4fc3f7; }
  body.th-ocean .card {
    border: 4px solid #4fc3f7; border-radius: 30px; background-color: #fff;
    background-image: radial-gradient(circle at 16px 22px, #e1f5fe 15px, transparent 16px);
    background-size: 32px 18px; background-repeat: repeat-x; background-position: left bottom;
  }
  body.th-ocean .card h2 { color: #0277bd; }
  body.th-ocean .tbtn { background: #fff; color: #0277bd; border-radius: 16px; }
  body.th-ocean .pbtn, body.th-ocean .okbtn { background: #29b6f6; border-radius: 22px; }
  body.th-ocean .pbtn.rest { background: #26a69a; }
  body.th-ocean .mbtn, body.th-ocean .rbtn { border-radius: 22px; }
  body.th-ocean .pbar i { background: #29b6f6; }
  body.th-ocean .per b { background: #b3e5fc; color: #01579b; }
  body.th-ocean .item { background: #e0f7fa; }
  body.th-ocean #ovBox { border: 5px solid #4fc3f7; border-radius: 30px; }
  body.th-ocean #cTasks::after { content: "🐠"; }
  body.th-ocean #cPomo::after { content: "🐢"; }
  body.th-ocean #cSched::after { content: "🐚"; }
  body.th-ocean #cMoney::after { content: "🐳"; }

  /* ===== 主題：太空冒險 ===== */
  body.th-space { background-color: #1b1446; color: #f3f0ff; background-image: radial-gradient(#fff 1px, transparent 2px), radial-gradient(#ffe066 1px, transparent 2px); background-size: 70px 70px, 110px 110px; background-position: 0 0, 40px 60px; }
  body.th-space #top { background: #2b2170; border-bottom: 3px dotted #ffd43b; }

<script>
(function () {

/* ================= 設定 ================= */
var API_URL = 'https://script.google.com/macros/s/AKfycbxY-7ZoZfDN-pRjV-p0rnsqRYWrbYpzthbUI_H90c94Zwzg8FIIP0QR-Nq9uzkYH_U2eA/exec';
var API_KEY = 'change-me-1234';
/* ======================================== */

var WD = '日一二三四五六';
var SPEND_CATS = ['零食', '文具', '玩具', '捐款', '其他'];
var INCOME_CATS = ['零用錢', '紅包', '獎勵', '其他'];

/* 主題：icons 依序是 任務、蕃茄鐘、課表、零用錢 的標題圖示 */
var THEMES = [
  { id: 'candy', name: '糖果樂園', em: '🍭', bg: '#fff0f6', bd: '#f783ac', icons: ['⭐', '🍅', '🎒', '🐷'] },
  { id: 'forest', name: '森林探險', em: '🌳', bg: '#eef7e4', bd: '#8bc34a', icons: ['🐞', '🍄', '🎒', '🐻'] },
  { id: 'ocean', name: '海洋世界', em: '🐳', bg: '#e3f2fd', bd: '#4fc3f7', icons: ['⭐', '🐙', '🎒', '🐷'] },
  { id: 'space', name: '太空冒險', em: '🚀', bg: '#2a2266', bd: '#ffd43b', icons: ['⭐', '⏰', '🎒', '💰'], dark: true },
  { id: 'kid', name: '怪盜月夜', em: '🎩', bg: '#14286e', bd: '#ffffff', icons: ['🎩', '🌙', '🃏', '💎'], dark: true },
  { id: 'simple', name: '簡約', em: '📋', bg: '#ffffff', bd: '#cbd2d9', icons: ['', '', '', ''] }
];
var FONTS = [
  { id: 'naikai', name: '內海體', desc: '俏皮手寫風（怪盜主題推薦）', file: 'fonts/naikai.woff' },
  { id: 'huninn', name: '粉圓體', desc: '圓圓胖胖，最可愛', file: 'fonts/huninn.woff' },
  { id: 'iansui', name: '芫荽體', desc: '像小朋友的手寫字', file: 'fonts/iansui.woff' },
  { id: 'wenkai', name: '文楷體', desc: '像鉛筆寫的字', file: 'fonts/wenkai.woff' },
  { id: 'system', name: '系統字體', desc: '最清楚、載入最快', file: '' }
];
function findById(list, id) {
  for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
  return list[0];
}
function theme() { return findById(THEMES, S.theme); }
function ic(i) { var e = theme().icons[i]; return e ? e + ' ' : ''; }
var loadedFont = '';
function applyFont() {
  var f = findById(FONTS, S.font);
  if (!f.file || loadedFont === f.id) return;
  var st = document.getElementById('fontStyle');
  if (!st) { st = document.createElement('style'); st.id = 'fontStyle'; document.head.appendChild(st); }
  st.textContent = '@font-face{font-family:"KidFont";src:url("' + f.file + '") format("woff");}';
  loadedFont = f.id;
}

/* ---------- 錯誤顯示 ---------- */
var errTimer = null;
window.onerror = function (msg, src, line) {
  var b = document.getElementById('errbar');
  if (!b) return false;
  b.textContent = '錯誤：' + msg + '（' + line + '）';
  b.style.display = 'block';
  clearTimeout(errTimer);
  errTimer = setTimeout(function () { b.style.display = 'none'; }, 10000);
  return false;
};

/* ---------- 小工具 ---------- */
function $(id) { return document.getElementById(id); }
function now() { return new Date().getTime(); }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function hm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function parseYmd(s) {
  var m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(String(s || ''));
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
function midnight(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function dayDiff(a, b) { return Math.round((midnight(b) - midnight(a)) / 86400000); }
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function money(n) {
  n = Math.round(Number(n) || 0);
  var neg = n < 0, s = String(Math.abs(n));
  while (/\d{4}/.test(s)) s = s.replace(/(\d)(\d{3})(?!\d)/, '$1,$2');
  return (neg ? '-' : '') + s;
}
function pct(a, b) { return b > 0 ? Math.max(0, Math.min(100, Math.round(a / b * 100))) : 0; }
function uid() { return now().toString(36) + Math.random().toString(36).slice(2, 7); }

function lsGet(k, def) {
  try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; }
}
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

/* ---------- 資料 ---------- */
var DEF_CONFIG = { exams: [], holidays: [], goalName: '', goalAmount: 0, pin: '0000', pomoStars: 1, nightStart: 21, nightEnd: 6 };
var C = lsGet('pp_cache', null) || {};          // 最後一次從試算表讀到的資料
var OUT = lsGet('pp_outbox', []);               // 還沒上傳的紀錄
var S = lsGet('pp_state', {});                  // 本機狀態
(function fixData() {
  var keys = ['tasks', 'schedule', 'reminders', 'rewards', 'ledgerRecent'];
  for (var i = 0; i < keys.length; i++) if (!C[keys[i]]) C[keys[i]] = [];
  if (!C.config) C.config = {};
  for (var k in DEF_CONFIG) if (C.config[k] === undefined) C.config[k] = DEF_CONFIG[k];
  if (!C.taskNet) C.taskNet = {};
  if (!S.night) S.night = 'auto';
  if (!S.theme) S.theme = 'candy';
  if (!S.font) S.font = 'huninn';
  if (!S.pomoStyle) S.pomoStyle = 'pie';
  if (!S.bag) S.bag = {};
})();
function saveOut() { lsSet('pp_outbox', OUT); }
function saveS() { lsSet('pp_state', S); }

function starTotal() {
  var t = Number(C.starTotal) || 0;
  for (var i = 0; i < OUT.length; i++) if (OUT[i].kind === 'star') t += Number(OUT[i].n) || 0;
  return t;
}
function balance() {
  var t = Number(C.ledgerBalance) || 0;
  for (var i = 0; i < OUT.length; i++) {
    var e = OUT[i];
    if (e.kind === 'ledger') t += e.type === '支出' ? -e.amt : e.amt;
  }
  return t;
}
function taskDone(name) {
  var today = ymd(new Date());
  var n = C.date === today ? (C.taskNet[name] || 0) : 0;
  var ref = today + '|' + name;
  for (var i = 0; i < OUT.length; i++) {
    var e = OUT[i];
    if (e.kind === 'star' && e.ref === ref) n += e.type === 'task' ? 1 : -1;
  }
  return n > 0;
}
function addEvent(e) {
  e.id = e.id || uid();
  OUT.push(e);
  saveOut();
  renderAll();
  syncSoon();
}
function starEvent(n, why, type, ref, id) {
  addEvent({ kind: 'star', id: id, time: ymd(new Date()) + ' ' + hm(new Date()), n: n, why: why, type: type, ref: ref || '' });
}
function ledgerEvent(type, desc, amt, src, id) {
  addEvent({ kind: 'ledger', id: id, date: ymd(new Date()), type: type, desc: desc, amt: amt, src: src || 'iPad' });
}

/* ---------- 日期規則 ---------- */
function dayOk(spec, wd) {
  spec = String(spec || '').replace(/\s/g, '');
  if (!spec || spec === '每天') return true;
  if (spec === '平日') return wd >= 1 && wd <= 5;
  if (spec === '週末' || spec === '假日') return wd === 0 || wd === 6;
  return spec.indexOf(WD.charAt(wd)) >= 0 || (wd === 0 && spec.indexOf('天') >= 0);
}
function isHoliday(d) {
  var s = ymd(d), h = C.config.holidays;
  for (var i = 0; i < h.length; i++) if (String(h[i]).slice(0, 10) === s) return true;
  return false;
}
function isSchool(d) { var w = d.getDay(); return w >= 1 && w <= 5 && !isHoliday(d); }
function schedTarget() {
  var n = new Date(), d = midnight(n);
  if (n.getHours() >= 17) d.setDate(d.getDate() + 1);
  for (var i = 0; i < 30 && !isSchool(d); i++) d.setDate(d.getDate() + 1);
  return d;
}
function todayTasks() {
  var wd = new Date().getDay(), r = [];
  for (var i = 0; i < C.tasks.length; i++) if (dayOk(C.tasks[i].days, wd)) r.push(C.tasks[i]);
  return r;
}
function isNight() {
  if (S.night === 'on') return true;
  if (S.night === 'off') return false;
  var h = new Date().getHours(), a = Number(C.config.nightStart), b = Number(C.config.nightEnd);
  if (isNaN(a)) a = 21;
  if (isNaN(b)) b = 6;
  return a > b ? (h >= a || h < b) : (h >= a && h < b);
}

/* ---------- 書包清單 ---------- */
function splitItems(s) {
  var p = String(s || '').split(/[、,，;；\/]+/), r = [];
  for (var i = 0; i < p.length; i++) { var t = p[i].replace(/^\s+|\s+$/g, ''); if (t) r.push(t); }
  return r;
}
function examsOn(ds) {
  var m = {}, L = C.examSchedule || [];
  for (var i = 0; i < L.length; i++) if (String(L[i].date).slice(0, 10) === ds) m[String(L[i].period)] = L[i];
  return m;
}
/* 一般課表；如果這天有段考，考試的節次會自動換成考試科目 */
function subjectsOf(d) {
  var wd = d.getDay(), r = [], ex = examsOn(ymd(d)), used = {};
  if (wd >= 1 && wd <= 5) {
    for (var i = 0; i < C.schedule.length; i++) {
      var per = String(C.schedule[i].period), s = C.schedule[i].d[wd - 1], e = ex[per];
      if (e) { used[per] = 1; r.push({ period: per, time: C.schedule[i].time, subj: String(e.subj), exam: true }); }
      else if (s) r.push({ period: per, time: C.schedule[i].time, subj: String(s) });
    }
  }
  for (var k in ex) {
    if (ex.hasOwnProperty(k) && !used[k]) r.push({ period: k, time: '', subj: String(ex[k].subj), exam: true });
  }
  return r;
}
function bagFor(d) {
  var subs = subjectsOf(d), ds = ymd(d), items = [], clothes = [], seen = {};
  function add(list, arr) {
    for (var i = 0; i < list.length; i++) if (!seen[list[i]]) { seen[list[i]] = 1; arr.push(list[i]); }
  }
  for (var i = 0; i < C.reminders.length; i++) {
    var r = C.reminders[i], hit = false, kw = String(r.kw || '');
    if (r.date) hit = String(r.date).slice(0, 10) === ds;
    else if (kw === '每天') hit = true;
    else if (kw) {
      for (var j = 0; j < subs.length; j++) if ((subs[j].subj + (subs[j].exam ? '考試' : '')).indexOf(kw) >= 0) { hit = true; break; }
    }
    if (hit) { add(splitItems(r.items), items); add(splitItems(r.clothes), clothes); }
  }
  return { items: items, clothes: clothes };
}

/* ================= 畫面 ================= */
function renderTop() {
  var d = new Date();
  $('date').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 週' + WD.charAt(d.getDay());
  var best = null, bestDays = 9999;
  for (var i = 0; i < C.config.exams.length; i++) {
    var ex = C.config.exams[i], ed = parseYmd(ex.date);
    if (!ed) continue;
    var n = dayDiff(d, ed);
    if (n >= 0 && n < bestDays) { best = ex; bestDays = n; }
  }
  var el = $('exam');
  if (!best) { el.textContent = ''; }
  else {
    el.className = bestDays <= 7 ? 'e-red' : (bestDays <= 14 ? 'e-orange' : 'e-green');
    el.textContent = bestDays === 0 ? '今天' + best.name + '，加油！' : best.name + ' 還有 ' + bestDays + ' 天';
  }
  $('nightBtn').textContent = '夜間：' + ({ auto: '自動', on: '開', off: '關' })[S.night];
  applyFont();
  document.body.className = bodyClass();
}

function pinnedReward() {
  for (var i = 0; i < C.rewards.length; i++) if (C.rewards[i].top) return C.rewards[i];
  return C.rewards[0] || null;
}

function renderTasks() {
  var list = todayTasks(), total = starTotal(), rw = pinnedReward();
  var h = '<h2>' + ic(0) + '今日任務</h2>';
  h += '<div class="starbar" data-act="rewards"><div class="sbtop"><span class="sbnum">★ ' + total + '</span>';
  h += '<span class="sbgoal">' + (rw ? '目標：' + esc(rw.name) + '（' + rw.stars + '★）　點我兌換' : '點我看獎勵') + '</span></div>';
  if (rw) h += '<div class="bar"><i style="width:' + pct(total, rw.stars) + '%"></i></div>';
  h += '</div><div class="list">';
  if (!list.length) h += '<div class="empty">' + (C.tasks.length ? '今天沒有任務，好好休息！' : '尚未同步任務資料') + '</div>';
  for (var i = 0; i < list.length; i++) {
    var done = taskDone(list[i].name);
    h += '<div class="task' + (done ? ' done' : '') + '" data-act="task" data-arg="' + i + '">' +
      '<span class="box">' + (done ? '✓' : '') + '</span><span class="tname">' + esc(list[i].name) + '</span>' +
      '<span class="tstar">+' + list[i].stars + '★</span></div>';
  }
  h += '</div>';
  $('cTasks').innerHTML = h;
}

function renderPomo() {
  var p = S.pomo, h = '<h2>' + ic(1) + '專注蕃茄鐘</h2>';
  h += '<div class="pmsg">' + (p ? (p.kind === 'focus' ? '專注中…完成可得 ' + C.config.pomoStars + '★' : '休息一下，喝口水')
    : '選一個時間開始吧') + '</div>';
  var st = pomoStyle(), rest = p && p.kind === 'rest' ? ' rest' : '';
  if (st.id === 'digit') {
    h += '<div id="pomoTime" data-act="pstyle">00:00</div><div class="bar pbar"><i id="pomoBar"></i></div>';
  } else if (st.id === 'ring') {
    h += '<div id="pwrap" data-act="pstyle"><div class="ringbox">' + graphic(st.id, rest) +

/* 依照卡片實際的大小，計算圖形與數字的尺寸，保證不會超出外框。
   卡片扁長時圖形和數字左右並排，卡片瘦高（例如直立）時改成上下排。 */
function fitDial() {
  var card = $('cPomo'), t = $('pomoTime');
  if (!card || !t) return;
  var used = 0, kids = card.children, cs = window.getComputedStyle(card);
  for (var i = 0; i < kids.length; i++) {
    if (kids[i].id === 'pwrap' || kids[i].id === 'pomoTime') continue;
    var ks = window.getComputedStyle(kids[i]);
    used += kids[i].offsetHeight + (parseFloat(ks.marginBottom) || 0) +
      (kids[i].className === 'prow' ? 0 : (parseFloat(ks.marginTop) || 0));   // prow 的上邊距是 auto，不能算進去
  }
  var H = Math.max(50, card.clientHeight - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0) - used - 4);
  var W = card.clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0) - 6;
  var st = pomoStyle(), w = $('pwrap'), svg = $('dial');
  var CH = 3.1;                                   // 「00:00」大約是字高的 3.1 倍寬
  if (!svg) {                                     // 大數字
    t.style.height = H + 'px';
    t.style.fontSize = Math.floor(Math.min(H * 0.7, W / CH)) + 'px';
    return;
  }
  w.style.height = H + 'px';
  var gw, gh, fs;
  if (st.id === 'ring') {
    gh = Math.floor(Math.max(50, Math.min(H - 4, W - 10, 260)));
    gw = gh;
    w.firstChild.style.width = gw + 'px';
    w.firstChild.style.height = gh + 'px';
    fs = Math.floor(gh * 0.2);
  } else {
    var r = st.ratio;
    // 左右並排：圖形佔寬度約一半
    var sideH = Math.min(H - 4, (W * 0.52) / r, 260), sideF = Math.min(sideH * 0.36, (W - sideH * r - 20) / CH);
    // 上下排：數字在圖形下方
    var stackF = Math.min(H * 0.2, W / CH), stackH = Math.min(H - stackF * 1.25 - 6, W / r, 260);
    var stack = Math.min(stackH, stackF * 3) > Math.min(sideH, sideF * 3) + 8;
    w.className = stack ? 'stack' : '';
    gh = Math.floor(Math.max(40, stack ? stackH : sideH));
    gw = Math.floor(gh * r);
    fs = Math.floor(Math.max(16, stack ? stackF : sideF));
  }
  svg.setAttribute('width', gw);
  svg.setAttribute('height', gh);
  t.style.fontSize = fs + 'px';
}

var actx = null;

  try {
    var A = window.AudioContext || window.webkitAudioContext;

}

      var o = actx.createOscillator(), g = actx.createGain();

}

  if ((el = $('pomoBar'))) el.style.width = pct(p.dur - left, p.dur) + '%';
  if ((el = $('pomoPie'))) el.setAttribute('d', piePath(f));

var seq = 0;

}

  t = setTimeout(function () { finish('逾時'); }, 20000);
  window[name] = function (d) { finish(null, d); };

  s.src = buildUrl(params);
  document.body.appendChild(s);
}

    if (!err || useFrame) { cb(err, d); return; }
    viaFrame(params, function (err2, d2) {          // JSONP 失敗就改用 iframe
      err2 = check(err2, d2);
      if (!err2) useFrame = true;
      cb(err2, d2);
    });
  });
}

var syncing = false, syncTimer = null, syncMsg = '', manualSync = false;
function renderSync() {
  var t = syncMsg;
  if (!t) t = S.lastSync ? '上次同步 ' + hm(new Date(S.lastSync)) : '尚未同步';
  if (OUT.length) t += '・' + OUT.length + ' 筆待上傳';
  $('syncInfo').textContent = t;
}
function syncSoon() { clearTimeout(syncTimer); syncTimer = setTimeout(sync, 1500); }
function pushAll(cb) {
  if (!OUT.length) { cb(true); return; }
  var batch = OUT.slice(0, 6);
  call({ action: 'push', ev: JSON.stringify(batch) }, function (err, d) {
    if (err) { cb(false, err); return; }
    var acked = {}, n = 0;
    for (var i = 0; i < d.acked.length; i++) { acked[d.acked[i]] = 1; n++; }
    var keep = [];
    for (i = 0; i < OUT.length; i++) if (!acked[OUT[i].id]) keep.push(OUT[i]);
    OUT = keep;
    saveOut();
    if (!n) { cb(false, '後端沒有收下任何紀錄'); return; }
    pushAll(cb);
  });
}
function sync() {
  if (syncing) return;
  syncing = true;
  syncMsg = '同步中…';
  renderSync();
  pushAll(function (ok, why) {
    if (!ok) { syncing = false; syncMsg = '上傳失敗：' + why; renderSync(); if (manualSync) toast('上傳失敗：' + why); manualSync = false; return; }
    var date = ymd(new Date());
    call({ action: 'load', date: date }, function (err, d) {
      syncing = false;
      if (err) { syncMsg = '讀取失敗：' + err; renderSync(); if (manualSync) toast('讀取失敗：' + err); manualSync = false; return; }
      if (manualSync) toast('同步完成！');
      manualSync = false;
      C = d;
      lsSet('pp_cache', C);
      S.lastSync = now();
      saveS();
      syncMsg = '';
      if (ovRender) refreshOv();
      renderAll();
    });
  });
}

/* ================= 點擊動作 ================= */
var ACTS = {
  task: function (i) {
    var t = todayTasks()[+i];
    if (!t) return;
    var done = taskDone(t.name), n = Number(t.stars) || 0, ref = ymd(new Date()) + '|' + t.name;
    if (done) starEvent(-n, '取消：' + t.name, 'untask', ref);
    else { starEvent(n, '完成：' + t.name, 'task', ref); toast('太棒了！+' + n + '★'); }
  },
  rewards: function () { openRewards(); },
  redeem: function (i) {
    var r = C.rewards[+i];
    if (!r) return;
    if (starTotal() < r.stars) { toast('星星還不夠喔，再加油！'); return; }
    askPin('兌換「' + r.name + '」', function () {
      var id = uid();
      starEvent(-r.stars, '兌換：' + r.name, 'redeem', '', id);
      if (r.money > 0) ledgerEvent('收入', '星星兌換：' + r.name, r.money, '星星兌換', id + 'L');
      toast('兌換成功：' + r.name);
    });
  },
  pomo: function (a) {
    unlockAudio();
    var min = parseInt(a.slice(1), 10);
    S.pomo = { kind: a.charAt(0) === 'f' ? 'focus' : 'rest', min: min, dur: min * 60000, end: now() + min * 60000 };
    saveS();
    renderPomo();
  },
  pstop: function () {
    if (!confirm('確定要停止嗎？（不會得到星星）')) return;
    S.pomo = null;
    saveS();
    renderPomo();
  },
  bag: function (i) {
    var item = bagFor(schedTarget()).items[+i];
    if (!item) return;
    if (S.bag.ok[item]) delete S.bag.ok[item]; else S.bag.ok[item] = 1;
    saveS();
    renderSched();
  },
  spend: function () { openKeypad('支出'); },
  income: function () { askPin('記收入', function () { openKeypad('收入'); }); },
  kp: function (k) { KP.amt = typeKey(KP.amt, k, 5).replace(/^0+/, ''); refreshOv(); },
  cat: function (c) { KP.cat = c; refreshOv(); },
  kpok: function () {
    var amt = parseInt(KP.amt, 10) || 0;
    if (!amt) { toast('請輸入金額'); return; }
    if (!KP.cat) { toast('請選一個項目'); return; }
    if (KP.type === '支出' && amt > balance()) { toast('餘額不夠喔'); return; }
    closeOv();
    ledgerEvent(KP.type, KP.cat, amt);
    toast('已記' + KP.type + ' $' + amt);
  },
  pin: function (k) {
    PIN.buf = typeKey(PIN.buf, k, 4);
    PIN.msg = '';
    if (PIN.buf.length === 4) {
      if (PIN.buf === String(C.config.pin)) { var cb = PIN.cb; closeOv(); cb(); return; }
      PIN.buf = '';
      PIN.msg = '密碼錯誤';
    }
    refreshOv();
  },
  close: function () { closeOv(); },
  sync: function () { manualSync = true; sync(); },
  night: function () {
    S.night = ({ auto: 'on', on: 'off', off: 'auto' })[S.night];
    saveS();
    renderTop();
  },
  reload: function () { location.reload(); },
  theme: function () { openTheme(); },
  setPomoStyle: function (id) { S.pomoStyle = id; saveS(); renderPomo(); refreshOv(); },
  pstyle: function () {
    var i = 0;
    for (var k = 0; k < POMO_STYLES.length; k++) if (POMO_STYLES[k].id === S.pomoStyle) i = k;
    S.pomoStyle = POMO_STYLES[(i + 1) % POMO_STYLES.length].id;
    saveS();
    renderPomo();
  },
  setTheme: function (id) {
    S.theme = id;
    if (id === 'kid' && S.font !== 'system') S.font = 'naikai';   // 怪盜主題自動搭配俏皮手寫字
    saveS();
    renderAll();
    refreshOv();
  },
  setFont: function (id) { S.font = id; saveS(); renderTop(); refreshOv(); }
};

function onTap(ev) {
  var el = ev.target;
  while (el && el.getAttribute && !el.getAttribute('data-act')) el = el.parentNode;
  if (!el || !el.getAttribute) return;
  var f = ACTS[el.getAttribute('data-act')];
  if (f) f(el.getAttribute('data-arg'));
}

/* ================= 啟動 ================= */
/* 依螢幕大小與方向選版面：wide 橫放、tall 直立、narrow 手機等小螢幕（改成上下捲動） */
var LAYOUT = 'wide';
function layoutOf() {
  var w = window.innerWidth, h = window.innerHeight;
  if (w < 600 || h < 480) return 'narrow';
  return w >= h ? 'wide' : 'tall';
}
function bodyClass() {
  return 'th-' + theme().id + ' L-' + LAYOUT + (S.font !== 'system' ? ' f-kid' : '') + (isNight() ? ' night' : '');
}
var lastSize = '';
function fit() {
  var size = window.innerWidth + 'x' + window.innerHeight;
  LAYOUT = layoutOf();
  $('app').style.height = LAYOUT === 'narrow' ? 'auto' : window.innerHeight + 'px';
  document.documentElement.className = LAYOUT === 'narrow' ? 'scroll' : '';
  document.body.className = bodyClass();
  if (size !== lastSize) { lastSize = size; window.scrollTo(0, 0); }
  renderAll();
}
function fitSched() {
  var c = $('cSched'), b = c && c.querySelector('.sbody');
  if (!b) return;
  if (LAYOUT === 'narrow') { c.className = 'card'; return; }
  for (var lv = 0; lv < 4; lv++) {
    c.className = 'card' + (lv ? ' sz' + lv : '');
    if (b.scrollHeight <= b.clientHeight + 1) return;
  }
}
var lastMin = -1, lastDay = ymd(new Date());
function tick() {
  var d = new Date();
  $('time').textContent = hm(d);
  tickPomo();
  if (d.getMinutes() !== lastMin) {
    lastMin = d.getMinutes();
    if (ymd(d) !== lastDay) { lastDay = ymd(d); sync(); }
    if (!ovRender) renderAll();
    if (now() - (S.lastSync || 0) > 5 * 60000) sync();
  }
}

$('app').addEventListener('click', onTap, false);
$('ov').addEventListener('click', onTap, false);
/* 旋轉時 iOS 會晚一點才更新尺寸，所以分兩次檢查 */
var fitTimer = null;
function fitLater() {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(function () { fit(); setTimeout(fit, 500); }, 150);
}
window.addEventListener('resize', fitLater, false);
window.addEventListener('orientationchange', fitLater, false);
window.addEventListener('pageshow', function () { tick(); sync(); }, false);
fit();
tick();
setInterval(tick, 1000);
sync();

})();
</script>

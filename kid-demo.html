<title>學習面板</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang TC", "Heiti TC", sans-serif;
    background: #eef1f5; color: #1f2933; font-size: 17px;
    -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0); -webkit-text-size-adjust: 100%;
  }
  [data-act] { cursor: pointer; touch-action: manipulation; }

  #app { display: flex; flex-direction: column; height: 100%; }
  #top {
    height: 60px; flex-shrink: 0; display: flex; align-items: center;
    padding: 0 12px; background: #fff; border-bottom: 1px solid #d9dee5;
  }
  #time { font-size: 38px; font-weight: bold; margin-right: 10px; }
  #date { font-size: 17px; color: #52606d; }
  #exam { flex: 1; text-align: center; font-size: 20px; font-weight: bold; }
  .e-green { color: #2b8a3e; } .e-orange { color: #e8590c; } .e-red { color: #c92a2a; }
  #syncInfo { font-size: 13px; color: #7b8794; margin-right: 4px; max-width: 230px; overflow: hidden; white-space: nowrap; }
  .tbtn {
    display: flex; align-items: center; justify-content: center; height: 38px; padding: 0 12px; margin-left: 6px;
    border-radius: 8px; background: #e4e7eb; font-size: 16px; line-height: 1; white-space: nowrap;
  }

  #main { flex: 1; display: flex; min-height: 0; padding: 3px; }
  .col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .card {
    flex: 1; min-height: 0; margin: 4px; background: #fff; border-radius: 12px;
    padding: 9px 12px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #d9dee5;
  }
  .card h2 { margin: 0 0 6px; font-size: 19px; flex-shrink: 0; }
  .card h3 { margin: 8px 0 4px; font-size: 16px; color: #52606d; flex-shrink: 0; }
  .empty { color: #9aa5b1; padding: 10px 0; }
  .bar { height: 12px; background: #e4e7eb; border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #f59f00; }

  /* 任務 */
  .starbar { background: #fff4e6; border-radius: 10px; padding: 6px 10px; margin-bottom: 4px; flex-shrink: 0; }
  .sbtop { display: flex; align-items: baseline; margin-bottom: 4px; }
  .sbnum { font-size: 24px; font-weight: bold; color: #e8590c; margin-right: 10px; flex-shrink: 0; white-space: nowrap; }
  .sbgoal { font-size: 15px; color: #7b8794; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .task { display: flex; align-items: center; padding: 9px 4px; border-bottom: 1px solid #eef1f5; font-size: 20px; }
  .box {
    width: 30px; height: 30px; flex-shrink: 0; border: 3px solid #9aa5b1; border-radius: 7px;
    margin-right: 12px; display: flex; align-items: center; justify-content: center; line-height: 1; font-size: 20px; color: #fff;
  }
  .task.done .box { background: #2f9e44; border-color: #2f9e44; }
  .task.done .tname { color: #9aa5b1; text-decoration: line-through; }
  .tname { flex: 1; }
  .tstar { color: #e8590c; font-size: 16px; margin-left: 8px; }

  /* 蕃茄鐘 */
  .pmsg { text-align: center; color: #52606d; flex-shrink: 0; line-height: 1.3; white-space: nowrap; overflow: hidden; }
  #pomoTime { font-size: 60px; font-weight: bold; text-align: center; line-height: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; }
  .pbar { margin: 4px 6px 8px; flex-shrink: 0; }
  #pwrap { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #pwrap.stack { flex-direction: column; }
  #pwrap.stack #pomoTime.ptime-side { margin: 4px 0 0; }
  .tom-bg { fill: #ffe3e3; stroke: #fa5252; stroke-width: 4; }
  .tom-fill { fill: #fa5252; }
  .tom-fill.rest { fill: #fab005; }
  .tom-shine { fill: #fff; opacity: 0.35; }
  .tom-leaf { fill: #40c057; }
  .hg-glass { fill: #f1f3f5; stroke: #adb5bd; stroke-width: 3; stroke-linejoin: round; }
  .hg-sand { fill: #f59f00; }
  .hg-sand.rest { fill: #40c057; }
  .hg-stream { stroke: #f59f00; stroke-width: 3; stroke-dasharray: 4 4; }
  .hg-stream.rest { stroke: #40c057; }
  .hg-wood { fill: #a9784d; }
  .bat-shell { fill: #f8f9fa; stroke: #495057; stroke-width: 5; }
  .bat-nub { fill: #495057; }
  .seg { fill: #e9ecef; }
  .seg.on { fill: #40c057; }
  .seg.on.mid { fill: #fab005; }
  .seg.on.low { fill: #fa5252; }
  body.th-space .tom-bg, body.th-space .hg-glass, body.th-space .bat-shell { fill: #3d3290; }
  body.th-space .seg { fill: #2a2266; }
  body.th-space .bat-shell, body.th-space .bat-nub { stroke: #c5bdf5; }
  body.th-space .bat-nub { fill: #c5bdf5; }

  /* ===== 直立版面（iPad 直放） ===== */
  body.L-tall #top { height: auto; min-height: 60px; flex-wrap: wrap; padding: 6px 10px; }
  body.L-tall #exam { -webkit-order: 9; order: 9; width: 100%; flex: none; padding: 2px 0 4px; }
  body.L-tall #syncInfo { max-width: 120px; margin-left: 8px; }
  body.L-tall .tbtn { padding: 0 9px; margin-left: 5px; }
  body.L-tall .pbtn, body.L-narrow .pbtn { font-size: 13px; margin: 0 2px; }
  .pbtn { font-size: 16px; margin: 0 3px; }
  body.L-tall .mbtn { font-size: 16px; }

  /* ===== 小螢幕（手機）：一張一張往下排，可以捲動 ===== */
  html.scroll, html.scroll body { height: auto; overflow: auto; }
  body.L-narrow #app { height: auto; }
  body.L-narrow #top { height: auto; flex-wrap: wrap; padding: 6px 8px; }

  /* ===== 怪盜飛行計時器 ===== */
  .glider { position: relative; overflow: hidden; border-radius: 12px; }

  .kid-sprite { position: absolute; left: 0; top: 0; width: 36%; margin-left: -18%; margin-top: -14%;
    -webkit-transition: -webkit-transform 1s linear; transition: transform 1s linear; }
  .kid-bob { -webkit-animation: kidbob 1.4s ease-in-out infinite alternate; animation: kidbob 1.4s ease-in-out infinite alternate; }
  .kid-flip { display: block; width: 100%; -webkit-transform: scaleX(-1); transform: scaleX(-1); }
  .kid-sprite.rest { width: 16%; margin-left: -8%; margin-top: -11%; }
  @-webkit-keyframes kidbob { from { -webkit-transform: translateY(-4%); } to { -webkit-transform: translateY(4%); } }
  @keyframes kidbob { from { transform: translateY(-4%); } to { transform: translateY(4%); } }
  .kid-dist { position: absolute; left: 8px; top: 6px; font-size: 13px; color: #fff; background: rgba(11,29,81,0.65); padding: 2px 8px; border-radius: 10px; white-space: nowrap; }

  .flip-hat svg { width: 100%; height: 100%; }
  @-webkit-keyframes hatflip { 0% { -webkit-transform: rotate(0deg); } 60% { -webkit-transform: translateY(-6%) rotate(195deg); } 100% { -webkit-transform: translateY(4%) rotate(180deg); } }
  @keyframes hatflip { 0% { transform: rotate(0deg); } 60% { transform: translateY(-6%) rotate(195deg); } 100% { transform: translateY(4%) rotate(180deg); } }
  .dove { position: absolute; width: 36px; height: 26px; -webkit-transition: -webkit-transform 2s ease-out, opacity 2s ease-in; transition: transform 2s ease-out, opacity 2s ease-in; }
  .dove svg { width: 100%; height: 100%; -webkit-animation: flap 0.25s ease-in-out infinite alternate; animation: flap 0.25s ease-in-out infinite alternate; }
  @-webkit-keyframes flap { to { -webkit-transform: scaleY(0.6); } }

  if (spec === '週末' || spec === '假日') return wd === 0 || wd === 6;

function taskInfo(t) {

  if (type === '準時') {

      r.cls = cdLeft(s0, mins) < 0 ? 'late' : 'warn';

function gemSvg(g, size, locked) {
  return '<svg class="gem" viewBox="0 0 40 40" width="' + size + '" height="' + size + '">' +
    (locked ? '<g opacity="0.3">' + treasureArt(g.shape, '#495057', '#868e96') + '</g>' : treasureArt(g.shape, g.c, g.a)) + '</svg>';
}
/* 任務對應的寶物：試算表 Tasks 的「寶物編號」欄（1～100）；沒填就自動分配前 6 種寶石 */
/* 任務的寶物：家長有指定就用指定的；沒有的話，一般任務配 ★1、準時／限時挑戰／連續配 ★2 */
function taskGem(task) {
  if (task.treasure >= 1 && task.treasure <= TR.length) return TR[task.treasure - 1];
  var h = 0, name = task.name || '', pool = POOL[HARD_TYPES[task.type] ? 2 : 1];
  for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 9973;
  return pool[h % pool.length];
}
/* 取得紀錄：S.got[id] = { n: 次數, first: 第一次時間, log: [最近 10 次] } */
function gotOf(id) {
  if (!S.got) {
    S.got = {};
    var m = S.museum || {};                              // 舊版只有次數，搬過來
    for (var k in m) if (m.hasOwnProperty(k) && m[k] > 0) S.got[k] = { n: m[k], first: '', log: [] };
  }
  return S.got[id];
}

    if (id !== 'grandjewel' && !(S.got.grandjewel && S.got.grandjewel.n) && gotCount() >= TR.length - 1) {   // 集滿 99 件 → 月之大寶石

/* 依照卡片實際的大小，計算圖形與數字的尺寸，保證不會超出外框。
   卡片扁長時圖形和數字左右並排，卡片瘦高（例如直立）時改成上下排。 */
function fitDial() {
  var card = $('cPomo'), t = $('pomoTime');
  if (!card || !t) return;
  var used = 0, kids = card.children, cs = window.getComputedStyle(card);
  for (var i = 0; i < kids.length; i++) {
    if (kids[i].id === 'pwrap' || kids[i].id === 'pomoTime') continue;
    var ks = window.getComputedStyle(kids[i]);
    used += kids[i].offsetHeight + (parseFloat(ks.marginBottom) || 0) +
      (kids[i].className === 'prow' ? 0 : (parseFloat(ks.marginTop) || 0));   // prow 的上邊距是 auto，不能算進去
  }
  var H = Math.max(50, card.clientHeight - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0) - used - 4);
  var W = card.clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0) - 6;
  var st = pomoStyle(), w = $('pwrap'), svg = $('dial');
  var CH = 3.1;                                   // 「00:00」大約是字高的 3.1 倍寬
  if (!svg) {                                     // 大數字
    t.style.height = H + 'px';
    t.style.fontSize = Math.floor(Math.min(H * 0.7, W / CH)) + 'px';
    return;
  }
  w.style.height = H + 'px';
  var gw, gh, fs;
  if (st.id === 'ring') {
    gh = Math.floor(Math.max(50, Math.min(H - 4, W - 10, 260)));
    gw = gh;
    w.firstChild.style.width = gw + 'px';
    w.firstChild.style.height = gh + 'px';
    fs = Math.floor(gh * 0.2);
  } else {
    var r = st.ratio;
    // 左右並排：圖形佔寬度約一半
    var sideH = Math.min(H - 4, (W * 0.52) / r, 260), sideF = Math.min(sideH * 0.36, (W - sideH * r - 20) / CH);
    // 上下排：數字在圖形下方
    var stackF = Math.min(H * 0.2, W / CH), stackH = Math.min(H - stackF * 1.25 - 6, W / r, 260);
    var stack = Math.min(stackH, stackF * 3) > Math.min(sideH, sideF * 3) + 8;
    w.className = stack ? 'stack' : '';
    gh = Math.floor(Math.max(40, stack ? stackH : sideH));
    gw = Math.floor(gh * r);
    fs = Math.floor(Math.max(16, stack ? stackF : sideF));
  }
  if (svg.tagName.toLowerCase() === 'svg') {
    svg.setAttribute('width', gw);
    svg.setAttribute('height', gh);
  } else {
    svg.style.width = gw + 'px';
    svg.style.height = gh + 'px';
  }
  t.style.fontSize = fs + 'px';
}

function saveSpecialRemote(m, msg) {

var actx = null;
function unlockAudio() {
  try {
    var A = window.AudioContext || window.webkitAudioContext;
    if (!actx && A) actx = new A();
    if (actx) beep(1, 0.01);
  } catch (e) {}
}
function beep(times, len) {
  if (!actx) return;
  try {
    var t = actx.currentTime;
    for (var i = 0; i < times; i++) {
      var o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880;
      g.gain.value = 0.3;
      o.connect(g);
      g.connect(actx.destination);
      o.start(t + i * 0.45);
      o.stop(t + i * 0.45 + (len || 0.25));
    }
  } catch (e) {}
}
function tickPomo() {
  var tEl = $('pomoTime'), p = S.pomo;
  if (!tEl || !p) return;
  var left = p.end - now();
  if (left <= 0) { finishPomo(); return; }
  var sec = Math.ceil(left * TIME_SCALE / 1000), f = left / p.dur, el;
  tEl.textContent = pad(Math.floor(sec / 60)) + ':' + pad(sec % 60);
  if ((el = $('pomoBar'))) el.style.width = pct(p.dur - left, p.dur) + '%';
  if ((el = $('pomoPie'))) el.setAttribute('d', piePath(f));
  if ((el = $('pomoRing'))) el.setAttribute('stroke-dashoffset', (RING_C * (1 - f)).toFixed(1));
  if ((el = $('tomLevel'))) {                       // 番茄：紅色從上往下變少
    var y = 32 + (1 - f) * 160;
    el.setAttribute('y', y.toFixed(1));
    el.setAttribute('height', (192 - y).toFixed(1));
  }
  if ((el = $('hgTop'))) {                          // 沙漏：上面變少、下面變多
    var ty = 22 + (1 - f) * 76, by = 178 - (1 - f) * 74;
    el.setAttribute('y', ty.toFixed(1));
    el.setAttribute('height', Math.max(0, 98 - ty).toFixed(1));
    $('hgBot').setAttribute('y', by.toFixed(1));
    $('hgBot').setAttribute('height', (178 - by).toFixed(1));
  }
  if ($('kidSprite')) moveKid(f, p.kind === 'rest');
  if ((el = $('hatLevel'))) {                       // 禮帽：白色從帽沿往上長
    var hy = 164 - (1 - f) * 134;
    el.setAttribute('y', hy.toFixed(1));
    el.setAttribute('height', (200 - hy).toFixed(1));
  }
  if ($('seg0')) {                                  // 電池：一格一格用完
    var on = Math.ceil(f * 10), cls = f > 0.5 ? 'seg on' : (f > 0.2 ? 'seg on mid' : 'seg on low');
    for (var i = 0; i < 10; i++) $('seg' + i).setAttribute('class', i < on ? cls : 'seg');
  }
}

  start_glider: ["It's Show Time！目標{x}，起飛！", "滑翔翼展開完畢。今晚的目的地——{x}。", "風向剛好，月色正好。陪我一起飛到{x}吧。", "從這裡到{x}，一秒都不能分心喔。", "高空的風很冷，但專注的心會讓你保持溫暖。出發！", "請繫好安全帶——開玩笑的，請拿好鉛筆。目標{x}！", "這趟飛行的燃料，就是你的專注力。", "夜空就是我的舞台，書桌就是你的舞台。一起出發吧！", "{x}在等著我們。途中可別往下看手機喔。", "起飛倒數三、二、一——Show Time！", "我負責飛，你負責專心。成交？", "今晚的航線很漂亮，就像你等一下要寫完的作業一樣。", "Ladies and gentlemen, it's show time！專注表演開始！", "保持微笑、保持撲克臉——開始專心吧。", "怪盜神出鬼沒，連分心的念頭都會被我偷走，放心專注吧。"],
  end_glider: ["抵達{x}！從起點一路專注飛到這裡，真有你的。", "降落成功！這段專注時間，比任何寶石都閃亮。", "{x}到了。一流的飛行，配上一流的專注。", "著陸完美！連月亮都忍不住為你鼓掌。", "任務完成，平安降落在{x}。辛苦了，搭檔。", "這趟飛行沒有一秒浪費，漂亮。", "我們到了！下次換條更遠的航線試試？", "專注飛行完成！收下這顆月光石吧。", "降落在{x}的屋頂——這可是只有我們知道的祕密。", "看吧，只要不放棄，再遠的地方都飛得到。", "飛行紀錄又多了一筆。你越來越像專業的了。", "BINGO！專注時間完美結束。", "對我怪盜基德而言沒有不可能——你剛剛也證明了這一點。", "從頭到尾都保持撲克臉、專心到最後，漂亮！"],
  start_tophat: ["請看好這頂黑色禮帽——魔術開始了。", "Ladies and Gentlemen！今晚的魔術，需要你的專注當咒語。", "黑色禮帽會慢慢變白……只要你一直專心。", "這是一場需要耐心的魔術。準備好了嗎？", "帽子裡藏著驚喜，不過要等專注結束才能揭曉。", "魔術師的祕訣只有一個：專心到最後一刻。開始吧！", "我數到三，你就開始專心。一、二、三——Show Time！", "這頂帽子只會為認真的人變色喔。", "請不要眨眼……不對，請不要分心。", "舞台燈光已經打亮，主角就是你。", "今晚的表演曲目：「專注的魔法」。開演！", "Ladies and gentlemen, it's show time！專注表演開始！", "保持微笑、保持撲克臉——開始專心吧。", "怪盜神出鬼沒，連分心的念頭都會被我偷走，放心專注吧。"],
  end_tophat: ["魔術完成！帽子一翻，白鴿全都飛出來了——這就是專注的魔法。", "黑帽子變成白帽子了！你的專注，連我都想拍手。", "看，白鴿為你的努力起飛了。", "完美的魔術需要完美的專注，你兩樣都做到了。", "Ladies and Gentlemen，請為今天的主角鼓掌！", "帽子全白了——這代表你一分鐘都沒有浪費。", "白鴿們說，牠們很喜歡你的專注。", "表演落幕。這份專注，就是最好的魔術。", "成功了！連我都猜不到你能這麼專心。", "魔術沒有祕密，只有練習。今天你又練習了一次。", "掌聲響起！帽子裡的鴿子都飛去報喜了。", "BINGO！專注時間完美結束。", "對我怪盜基德而言沒有不可能——你剛剛也證明了這一點。", "從頭到尾都保持撲克臉、專心到最後，漂亮！"],
  start_pie: ["計時開始。這塊時間圓餅，就交給你慢慢吃完了。", "圓餅越變越小，你的作業也會越變越少。", "時鐘已經開始轉動，你也開始動筆吧。", "這段時間，就當作是只屬於你的舞台。", "專心看著題目，不用看著時鐘——我幫你看。", "時間是最珍貴的寶石，好好使用它。", "預告：這段專注時間結束後，你會比現在更厲害。", "時針、分針，還有你的筆尖，一起出發！", "一口一口吃掉時間圓餅吧，開始！", "紳士的禮儀之一：準時開始，專心到最後。", "時間開始流動了。別讓它白白溜走喔。", "Ladies and gentlemen, it's show time！專注表演開始！", "保持微笑、保持撲克臉——開始專心吧。", "怪盜神出鬼沒，連分心的念頭都會被我偷走，放心專注吧。"],
  end_pie: ["圓餅全部吃完！這段時間被你用得乾乾淨淨。", "時間到！你剛剛的專注，可以打滿分。", "完成！時鐘轉了一圈，你也往前走了一大步。", "漂亮收尾。這就是時間管理的魔術。", "專注時間結束，休息一下，喝口水吧。", "一塊圓餅換來一身本領，划算。", "時間到！我就知道你辦得到。", "這段時間沒有被偷走——因為你守住它了。", "完美！連我這個怪盜都偷不走你的專注。", "鈴響了。今天的你，比剛才的你更厲害一點。", "BINGO！專注時間完美結束。", "對我怪盜基德而言沒有不可能——你剛剛也證明了這一點。", "從頭到尾都保持撲克臉、專心到最後，漂亮！"],
  start_ring: ["圓環倒數開始。圈圈消失前，請保持專心。", "這個圓圈就像月亮，會慢慢缺一角。開始吧！", "專注模式啟動。這段時間，誰都別想打擾你。", "圓環會慢慢變短，你的待辦清單也是。", "準備好了嗎？光環即將開始倒數。", "把這個圓圈當成舞台燈，燈熄之前好好表演。", "時間的戒指已經戴上，現在專心吧。", "一圈的時間，夠你完成很多事了。", "開始！我會在終點等你。", "專心看前方，就像我在夜空中只看著月亮。", "Ladies and gentlemen, it's show time！專注表演開始！", "保持微笑、保持撲克臉——開始專心吧。", "怪盜神出鬼沒，連分心的念頭都會被我偷走，放心專注吧。"],

  start_tomato: ["番茄計時開始！紅紅的番茄，代表滿滿的專注力。", "番茄會慢慢變少，但你的實力會慢慢變多。", "準備好了嗎？這顆番茄就交給你了。", "專心吃掉這顆番茄吧——用專注力吃。", "番茄時間！手機收起來，筆拿起來。", "這顆番茄是今晚的道具，好好使用它。", "番茄開始倒數，魔術也開始了。", "紅色代表熱情，也代表專心。出發！", "一顆番茄的時間，就能讓你更接近目標。", "我在旁邊幫你看著這顆番茄，你專心就好。", "Ladies and gentlemen, it's show time！專注表演開始！", "保持微笑、保持撲克臉——開始專心吧。", "怪盜神出鬼沒，連分心的念頭都會被我偷走，放心專注吧。"],
  end_tomato: ["番茄吃完了！這顆番茄的營養，全都變成你的實力。", "時間到！完美的一顆番茄。", "番茄消失了——不是被我偷走的，是被你用完的。", "完成！再來一顆番茄嗎？還是先休息一下？", "專注完成！這顆番茄真是又紅又甜。", "漂亮！番茄田又多了一份收穫。", "時間到！你的專注力比番茄還新鮮。", "一顆番茄換一顆月光石，收好喔。", "番茄計時結束。休息五分鐘，伸個懶腰吧。", "做得好！連農夫都會稱讚你的耐心。", "BINGO！專注時間完美結束。", "對我怪盜基德而言沒有不可能——你剛剛也證明了這一點。", "從頭到尾都保持撲克臉、專心到最後，漂亮！"],
  start_hourglass: ["沙漏翻轉！沙子開始流動，你的專注也開始了。", "每一粒沙，都是一小段珍貴的時間。", "沙子落下的聲音，就是專注的節拍。", "我把沙漏翻過來了，接下來就看你的了。", "沙漏不會停下來，你也不要停下來喔。", "上面的沙子流完之前，請保持專心。", "時間像沙子一樣，握緊了才不會溜走。", "沙漏計時開始。安靜，專心，出發。", "古老的魔術師都用沙漏計時——今天你也是魔術師。", "準備好了嗎？沙子已經開始旅行了。", "Ladies and gentlemen, it's show time！專注表演開始！", "保持微笑、保持撲克臉——開始專心吧。", "怪盜神出鬼沒，連分心的念頭都會被我偷走，放心專注吧。"],
  end_hourglass: ["沙子全部落下！這段時間，一粒都沒有浪費。", "沙漏走完了，你的專注也滿分了。", "完成！下面堆滿的沙子，就是你的努力。", "時間到！你和沙漏一樣穩定。", "最後一粒沙落下，表演完美結束。", "漂亮！要再翻一次沙漏嗎？先休息一下吧。", "沙漏見證了你的專注。我也是。", "每一粒沙都被你好好使用了，了不起。", "時間到！你的耐心比沙漏還厲害。", "完成！這些沙子會記得你今天有多認真。", "BINGO！專注時間完美結束。", "對我怪盜基德而言沒有不可能——你剛剛也證明了這一點。", "從頭到尾都保持撲克臉、專心到最後，漂亮！"],
  start_battery: ["專注電池充飽了！開始放電吧。", "電量百分之百，專注模式啟動！", "這顆電池的電，要全部用在專心上喔。", "能量滿格！把它用在最重要的事情上。", "電池開始倒數，你的大腦開始發電。", "準備好了嗎？用完這顆電池，你就升級了。", "滿滿的電量，滿滿的專注，出發！", "電池一格一格減少，你的待辦一項一項完成。", "把手機的電省下來，用你自己的電吧。", "專注能量注入完畢，Show Time！", "Ladies and gentlemen, it's show time！專注表演開始！", "保持微笑、保持撲克臉——開始專心吧。", "怪盜神出鬼沒，連分心的念頭都會被我偷走，放心專注吧。"],
  end_battery: ["電池用完了！這些能量全都變成你的實力。", "電量歸零——代表你全力以赴了。", "完成！記得休息一下，幫自己充充電。", "一格都沒浪費，這才是高效率。", "放電完畢！你的專注力真是驚人。", "電池見底了，你的成就卻滿格了。", "時間到！現在換你補充能量，喝口水吧。", "漂亮！這顆電池用得比我的滑翔翼還值得。", "完成！充個電，下一場表演再見。", "全力以赴的你，比任何寶石都耀眼。", "BINGO！專注時間完美結束。", "對我怪盜基德而言沒有不可能——你剛剛也證明了這一點。", "從頭到尾都保持撲克臉、專心到最後，漂亮！"],
  start_digit: ["計時開始。數字在跳，你的專注也在跳動。", "倒數開始！看清楚目標，然後全力前進。", "時間在走，我們也出發吧。", "專注模式啟動。就從現在這一秒開始。", "每一秒都是寶石，好好收集起來。", "大大的數字，大大的決心。開始！", "準備好了嗎？舞台已經為你準備好了。", "時間開始倒數，魔術也開始了。", "我不偷時間，我只偷懶惰——開始專心吧！", "這段時間只屬於你，別讓任何事打擾。", "Ladies and gentlemen, it's show time！專注表演開始！", "保持微笑、保持撲克臉——開始專心吧。", "怪盜神出鬼沒，連分心的念頭都會被我偷走，放心專注吧。"],
  end_digit: ["數字歸零！你完美地完成了這段專注。", "時間到！剛剛的你超級專心。", "完成！每一秒都被你好好收藏了。", "倒數結束，掌聲響起——為你鼓掌！", "漂亮！這段時間，你用得一點都不浪費。", "時間到！休息一下，你值得。", "專注完成！這就是一流的表現。", "零秒了。你剛剛創造了好多價值。", "完美收尾，連我都想學你的專注力。", "倒數完成！今天的你又更進步了。", "BINGO！專注時間完美結束。", "對我怪盜基德而言沒有不可能——你剛剛也證明了這一點。", "從頭到尾都保持撲克臉、專心到最後，漂亮！"],
  restStart: ["休息時間到。紳士也需要喝杯茶。", "閉上眼睛、伸個懶腰，放鬆一下吧。", "休息五分鐘！去喝口水，看看窗外。", "表演中場休息，觀眾也要上廁所的。", "休息不是偷懶，是為了下一場表演做準備。", "讓眼睛休息一下，看看遠方吧。", "中場休息！不過別跑去玩手機喔。", "深呼吸三次，把剛剛的疲勞吐出去。", "就連怪盜也會在屋頂上休息一下。", "休息時間，給自己一個小小的獎勵吧。", "表演中場休息。紳士也要保持優雅地喝杯水。"],
  rest: ["休息結束！準備好了嗎？下一場表演要開始囉。", "中場休息結束，請回到座位上。", "充電完成！再來一輪吧。", "休息夠了，月亮也在等你回來。", "好了，喝完水了嗎？繼續出發！", "休息時間到此結束，主角請上台。", "精神恢復了吧？下一個任務在等你。", "休息完畢！接下來會更順利的。", "很好，帶著好心情繼續吧。", "中場結束，第二幕即將開演！", "中場休息結束——保持微笑，第二幕開演！"],
  task: ["漂亮！又一項任務到手，還順便收下了一顆{x}。", "{x}到手！這份認真，連月亮都在看著你。", "漂亮！又一項任務到手，手法乾淨俐落。", "完成！魔術的秘密，就是每天多練習一點點。", "任務達成！一流的怪盜從不拖延，你也是。", "做得好！下一個舞台，也交給你了。", "又解決一項！你的手法越來越熟練了。", "收下這顆{x}吧，這是你應得的。", "完成一項！照這個速度，今晚就能收工了。", "太棒了！連我都想把你寫進預告函裡。", "這項任務，被你漂亮地拿下了。", "一項完成！紳士做事，就是這麼乾脆。", "BINGO！又一項任務到手，完美。", "我是個完美主義者——而你今天的表現，也很完美。", "保持微笑、保持撲克臉，任務就這樣漂亮地完成了。", "對怪盜基德而言沒有不可能，對你也一樣！", "神出鬼沒地完成任務，這手法我欣賞。", "任務到手。怪盜是不會說謊的——你真的很棒。", "好奇心是最好的老師，繼續保持喔。", "一項接一項，就像魔術一樣俐落。"],
  taskAll: ["今天的任務全部完成！這場表演完美落幕——為你鼓掌！", "全部搞定！今晚的月光，就是為你準備的聚光燈。", "全部完成！預告函已經送到你手上了。", "任務清單清空！你今天真的很了不起。", "完美的一天！就連最厲害的偵探也找不到你的破綻。", "全數達成！今晚可以安心地看月亮了。", "全部完成！你就是今天的主角。", "一項不漏！這份認真，是最閃亮的寶石。", "今天的表演，滿分落幕。", "全部拿下！明天也請繼續讓我驚訝吧。", "BINGO！今天的任務全數到手，完美收場！", "宣告今天結束的鐘聲響起——你完美地演完了全場。", "對我怪盜基德而言沒有不可能，看來對你也是！", "全部完成！我這個完美主義者，也挑不出任何毛病。", "Ladies and gentlemen，請為今天的主角鼓掌！", "今晚的舞台完美落幕，明天我們一定會再見面的。"],
  bag: ["很好，這個放進去了。準備萬全，才是紳士的禮儀。", "收好了！小細節決定大成功。", "再確認一次——好的魔術師從不忘記道具。", "放進去了！明天的你會感謝現在的你。", "很好！道具檢查，一項一項來。", "收好一樣！忘東忘西可不是紳士的作風。", "完美！魔術道具就要這樣整理。", "這個也準備好了，真細心。", "一樣一樣收好，明天就不會手忙腳亂。", "漂亮！你的準備功夫，一流。", "BINGO！道具放進去了。", "魔術師的口袋裡，從來不會少一樣道具。", "準備好了——無論何時，都不忘保持撲克臉。", "細心的準備，就是完美演出的祕密。"],
  bagAll: ["書包整理完畢！明天的舞台，你已經準備好了。", "道具全部到齊！明天就漂亮地登場吧。", "全部收好了！這副魔術撲克牌送給你。", "完美！準備萬全的人，運氣都不會太差。", "書包整理好了，今晚可以安心睡覺了。", "全部到齊！明天出門一樣都不會少。", "準備完成！真正的高手，總是提前準備好。", "道具檢查完畢，明天的表演萬無一失。", "書包收好了！這份細心，連偵探都佩服。", "全部搞定！明天早上可以從容出門了。", "道具檢查完畢，BINGO！明天的表演萬無一失。", "完美主義者的書包，就該整理得這麼漂亮。", "全部收好了！就像魔術箱一樣，什麼都不缺。", "準備萬全。明天就帶著微笑和撲克臉出門吧！"],
  redeem: ["獎勵到手！這可是你憑實力贏來的寶物。", "兌換成功！好好享受吧，你值得。", "這份獎勵，是你一顆一顆寶石換來的。", "恭喜！努力過後的獎勵，特別閃亮。", "成交！這筆交易，連我都覺得很划算。", "獎勵送到！下一個目標是什麼呢？", "收下吧！這皇冠也一併送給你。", "兌換完成！你的努力，終於變成寶物了。", "好好享受獎勵，然後繼續閃閃發亮吧。", "這份獎勵，比我偷過的任何寶石都珍貴。", "BINGO！獎勵到手。", "這份寶物，是你憑實力換來的，請收下。"],
  unlock: ["新路線解鎖：{x}！下一次專注，就飛這條吧。", "恭喜！你解鎖了新航線：{x}。", "本週的努力換來新的天空——{x}，出發吧！", "新的目的地出現了：{x}。我已經迫不及待了。", "解鎖成功！{x}的夜景，一定很漂亮。", "你的專注打開了新的航線：{x}！", "新航線{x}已開通，滑翔翼隨時待命。", "厲害！連{x}的路線都被你解鎖了。", "{x}，等著我們吧！", "新的舞台：{x}。下一次專注就在那裡表演！", "BINGO！新航線開通：{x}！"],
  sleep: ["已經九點了。就算是怪盜，也需要充足的睡眠喔，晚安。", "月亮都爬到天空正中央了——該上床囉，明天見。", "今天的表演到此結束。晚安，好夢。", "早點睡，明天才有精神繼續閃閃發亮。", "熬夜不是紳士的作風喔。該睡覺了。", "把書包收好、刷好牙，就去睡吧。晚安。", "夜晚是我的工作時間，卻是你的休息時間。晚安！", "睡個好覺，夢裡也許會遇見滑翔翼喔。", "明天見！今晚的月亮會守護你的。", "該關燈囉。今天辛苦了，晚安。", "再見了，小魔術師。在宣告今天結束的鐘聲下，我們明天一定會再見面的。", "今晚的表演到此為止，好好睡吧——明天見。", "就算是神出鬼沒的怪盜，也要乖乖睡覺。晚安。"],
  bday: ["生日快樂，小布丁！今晚的月亮，是特地為你升起的。", "七月九日——全世界最重要的日子之一。小布丁，生日快樂！", "我原本想偷走一顆寶石，結果發現最閃亮的是今天的壽星。生日快樂！", "Ladies and Gentlemen，請為今天的主角小布丁鼓掌！", "又長大一歲了！願你今年的每一天，都像魔術一樣精彩。", "生日快樂！白鴿們都飛來幫你唱生日歌了。", "小布丁，生日快樂。今天的任務就是——好好被大家寵愛。", "許個願吧！這次換我幫你守護它。", "今天的預告函特別不一樣喔，記得完成任務去收下它。", "生日快樂！你是我見過最認真、最閃亮的小魔術師。", "生日快樂！今天的你，比任何寶石都閃亮——BINGO！", "Ladies and gentlemen，今天的主角是小布丁！生日快樂！"],
  moneyTip: ["理財小祕訣：買東西前先問自己——這是「需要」，還是「想要」？", "想要的東西，先等三天再決定。三天後還想要，才是真的想要。", "紳士的習慣：拿到零用錢，先存一部分，再花剩下的。", "小錢也會變大錢。每天省 10 元，一個月就有 300 元喔。", "買之前比一比價格，同樣的東西，聰明的人會買到更划算的。", "試試看把錢分成三份：存起來、花掉、分享給別人。", "把存錢目標寫下來，每天看一眼，就比較不會亂花。", "零食吃完就沒了，但存下來的錢，可以換到更大的夢想。", "朋友有的東西，不一定你也需要。不跟風，也是一種帥氣。", "記帳的人最厲害——因為你知道每一塊錢跑到哪裡去了。", "大目標可以拆成小目標，一步一步存，就一定到得了。", "借來的錢一定要還。守信用，是比寶石更珍貴的東西。", "好的東西可以用很久。買的時候想想：它能陪我多久？", "花錢買經驗也很棒，例如一本好書，或一次學習的機會。", "如果今天沒有花錢，那也是一種勝利喔。", "東西壞了先想想能不能修好，修好再用也很酷。", "等待的時間，會讓你更珍惜得到的東西。", "看到「限時特價」先冷靜。真正需要的東西，不怕等一下。", "存錢就像收集寶石，一顆一顆，最後會變成寶藏。", "錢是工具，不是目標。把它用在讓你和別人開心的地方吧。", "冰淇淋很冰，但也很甜；存錢一開始很辛苦，最後也會很甜。", "像潘多拉的盒子一樣，衝動購物前先停一下，想清楚再打開錢包。", "怪盜是不會說謊的：存下來的每一塊錢，都會守護你的夢想。"],

var RPG = { queue: [], timer: null, typing: null, full: '' };
function kidOn() { return theme().id === 'kid' && S.talk !== 'off'; }
/* extra：{ r: 獎勵內容, c: [[動作, 按鈕文字], ...] } */
function kidSay(kind, x, extra) {
  if (!kidOn()) return false;
  var L = KID_LINES[kind];
  if (!L) return false;
  return kidSayText(L[Math.floor(Math.random() * L.length)].replace('{x}', x === undefined || x === null ? '' : x), extra);
}
function kidSayText(text, extra, now) {
  if (!kidOn()) return false;
  var it = { t: text, r: extra && extra.r ? rewardHtml(extra.r) : '', c: extra && extra.c ? extra.c : null };
  if (now) { RPG.queue = [it]; rpgNext(); return true; }       // 回應按鈕：馬上換成這一句
  RPG.queue.push(it);
  if (RPG.queue.length > 3) RPG.queue.shift();
  if ($('rpg').style.display !== 'block') rpgNext();
  return true;
}
/* 對話框裡的獎勵明細 */
function rewardHtml(o) {
  var h = '<div class="rwd">';
  if (o.n) h += '<span class="rchip dia">' + SYM() + ' +' + o.n + (o.bonus ? '<small>（含加碼 ' + o.bonus + '）</small>' : '') + '</span>';
  function chip(x, drop) {
    return '<span class="rchip gem' + (drop ? ' drop' : '') + '" style="border-color:' + RARITY[x.gem.r][1] + '">' + gemSvg(x.gem, 22) + ' ' + x.gem.name +
      '<small style="color:' + RARITY[x.gem.r][1] + '">' + new Array(x.gem.r + 1).join('★') + '</small>' + (x.first ? '<small>新收藏！</small>' : '<small>×' + x.cnt + '</small>') + '</span>';
  }
  if (o.gem) h += chip(o, false);
  if (o.drops) for (var di = 0; di < o.drops.length; di++) h += chip(o.drops[di], true);
  h += '</div>';
  if (o.line) h += '<div class="rline">' + o.line + '</div>';
  return h;
}
function progressLine() {
  var tl = todayTasks(), d = 0;
  for (var i = 0; i < tl.length; i++) if (taskDone(tl[i].name)) d++;
  if (!tl.length) return '';
  return d >= tl.length ? '🎉 今日任務全部完成！' : '今日進度 ' + d + ' / ' + tl.length + '，再完成 ' + (tl.length - d) + ' 個就全部達成！';
}
function gemReward(gem, n, bonus, line) { var g = gotOf(gem.id) || { n: 1 }; return { n: n, bonus: bonus, gem: gem, cnt: g.n, first: g.n === 1, line: line }; }
var LAST_REWARD = null;
var THANKS = ["不客氣，小魔術師！", "能看到你的笑容，就是最好的回禮。", "BINGO！我們是最佳搭檔。", "不用謝——表演的主角一直都是你。", "嘿嘿，保持撲克臉……其實我也很開心。", "謝謝你這麼努力，讓我也想更認真了。", "我只是遞上道具，真正變出魔術的是你。", "下次也讓我看看你的精彩演出吧！", "這是紳士的禮儀，不足掛齒。", "今晚的月亮，也替我說聲：你好棒！"];
/* 對話框按鈕 */
function rpgChoice(a) {
  var parts = String(a).split(':');
  if (parts[0] === 'thanks') { kidSayText(THANKS[Math.floor(Math.random() * THANKS.length)], null, true); return; }
  if (parts[0] === 'next') {
    var tl = todayTasks(), nx = null;
    for (var i = 0; i < tl.length; i++) if (!taskDone(tl[i].name) && !taskInfo(tl[i]).lock && tl[i].type !== '專注') { nx = tl[i]; break; }
    if (!nx) { kidSayText('今天能做的任務都完成了！去商店逛逛，或好好休息一下吧。', { c: [['shop', '去商店逛逛'], ['thanks', '謝謝基德']] }, true); return; }
    var inf = taskInfo(nx), gem = taskGem(nx);
    kidSayText('下一個目標：「' + nx.name + '」！完成就能拿到 ' + SYM() + ' ' + nx.stars + (nx.bonus ? '（加碼再 +' + nx.bonus + '）' : '') + '，還有一顆' + gem.name + '。' +
      (inf.chip && inf.chip.indexOf('<') < 0 ? '　' + inf.chip : '') + '　It\'s show time！', { c: [['thanks', '好，我去做！']] }, true);
    return;
  }
  hideRpg();
  if (parts[0] === 'gem') openTreasure(parts[1]);
  else if (parts[0] === 'shop') openShop();
  else if (parts[0] === 'collect') openCollect('gem');
  else if (parts[0] === 'again') ACTS.pomo('f' + (parts[1] || 25));
  else if (parts[0] === 'rest') ACTS.pomo('r5');
}
function hideRpg() { RPG.queue = []; clearInterval(RPG.typing); clearTimeout(RPG.timer); RPG.typing = null; $('rpg').style.display = 'none'; }
function rpgNext() {
  clearInterval(RPG.typing);
  clearTimeout(RPG.timer);
  RPG.typing = null;
  var it = RPG.queue.shift(), el = $('rpgText'), i = 0;
  if (!it) { $('rpg').style.display = 'none'; return; }
  var t = it.t;
  RPG.full = t;
  RPG.cur = it;
  $('rpgExtra').innerHTML = '';
  var av = KID_IMG.avatars, k = Math.floor(Math.random() * av.length);   // 每次隨機換頭像
  if (k === RPG.lastAva) k = (k + 1) % av.length;
  RPG.lastAva = k;
  $('rpgAva').src = av[k];
  $('rpg').style.display = 'block';
  el.textContent = '';
  RPG.typing = setInterval(function () {             // 一個字一個字跑出來
    i++;
    el.textContent = t.slice(0, i);
    if (i >= t.length) { clearInterval(RPG.typing); RPG.typing = null; rpgExtra(); }
  }, 50);

/* ================= 同步 ================= */
var seq = 0;
function buildUrl(params) {
  var q = ['key=' + encodeURIComponent(API_KEY), '_=' + now()];
  for (var k in params) if (params.hasOwnProperty(k)) q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
  return API_URL + '?' + q.join('&');
}
function copy(o) { var r = {}; for (var k in o) if (o.hasOwnProperty(k)) r[k] = o[k]; return r; }

function viaJsonp(params, cb) {
  var name = '__cb' + (++seq) + '_' + now(), s = document.createElement('script'), done = false, t;
  function finish(err, d) {
    if (done) return;
    done = true;
    clearTimeout(t);
    window[name] = function () {};
    if (s.parentNode) s.parentNode.removeChild(s);
    cb(err, d);
  }
  t = setTimeout(function () { finish('逾時'); }, 20000);
  window[name] = function (d) { finish(null, d); };
  s.onerror = function () { finish('載入失敗'); };
  params = copy(params);
  params.callback = name;
  s.src = buildUrl(params);
  document.body.appendChild(s);
}
function viaFrame(params, cb) {
  var n = 'f' + (++seq) + '_' + now(), f = document.createElement('iframe'), done = false, t;
  f.style.display = 'none';
  function onMsg(ev) {
    var d = null;
    try { d = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data; } catch (e) { return; }
    if (d && d.n === n) finish(null, d);
  }
  function finish(err, d) {
    if (done) return;
    done = true;
    clearTimeout(t);
    window.removeEventListener('message', onMsg, false);
    if (f.parentNode) f.parentNode.removeChild(f);
    cb(err, d);
  }
  t = setTimeout(function () { finish('逾時'); }, 25000);
  window.addEventListener('message', onMsg, false);
  params = copy(params);
  params.mode = 'frame';
  params.n = n;
  f.src = buildUrl(params);
  document.body.appendChild(f);
}
var useFrame = false;
function call(params, cb) {
  function check(err, d) {
    if (!err && (!d || d.app !== 'ipad-panel')) err = '回應不正確';
    if (!err && !d.ok) err = d.error || '後端錯誤';
    return err;
  }
  (useFrame ? viaFrame : viaJsonp)(params, function (err, d) {
    err = check(err, d);
    if (!err || useFrame) { cb(err, d); return; }
    viaFrame(params, function (err2, d2) {          // JSONP 失敗就改用 iframe
      err2 = check(err2, d2);
      if (!err2) useFrame = true;
      cb(err2, d2);
    });
  });
}

var syncing = false, syncTimer = null, syncMsg = '', manualSync = false;
function renderSync() {
  var t = syncMsg;
  if (!t) t = S.lastSync ? '上次同步 ' + hm(new Date(S.lastSync)) : '尚未同步';
  if (OUT.length) t += '・' + OUT.length + ' 筆待上傳';
  $('syncInfo').textContent = t;
}
function syncSoon() { clearTimeout(syncTimer); syncTimer = setTimeout(sync, 1500); }
function pushAll(cb) {
  if (!OUT.length) { cb(true); return; }
  var batch = OUT.slice(0, 6);
  call({ action: 'push', ev: JSON.stringify(batch) }, function (err, d) {
    if (err) { cb(false, err); return; }
    var acked = {}, n = 0;
    for (var i = 0; i < d.acked.length; i++) { acked[d.acked[i]] = 1; n++; }
    var keep = [];
    for (i = 0; i < OUT.length; i++) if (!acked[OUT[i].id]) keep.push(OUT[i]);
    OUT = keep;
    saveOut();
    if (!n) { cb(false, '後端沒有收下任何紀錄'); return; }
    pushAll(cb);
  });
}
function sync() {
  if (DEMO) { syncMsg = '模擬模式（不連線）'; renderSync(); return; }
  if (syncing) return;
  syncing = true;
  syncMsg = '同步中…';
  renderSync();
  pushAll(function (ok, why) {
    if (!ok) { syncing = false; syncMsg = '上傳失敗：' + why; renderSync(); if (manualSync) toast('上傳失敗：' + why); manualSync = false; return; }
    var date = ymd(new Date());
    call({ action: 'load', date: date }, function (err, d) {
      syncing = false;
      if (err) { syncMsg = '讀取失敗：' + err; renderSync(); if (manualSync) toast('讀取失敗：' + err); manualSync = false; return; }
      if (manualSync) toast('同步完成！');
      manualSync = false;
      C = d;
      normAll();
      lsSet(K('pp_cache'), C);
      S.lastSync = now();
      saveS();
      syncMsg = '';
      if (ovRender) refreshOv();
      renderAll();
    });
  });
}

  kp: function (k) { KP.amt = typeKey(KP.amt, k, 5).replace(/^0+/, ''); refreshOv(); },
  cat: function (c) { KP.cat = c; refreshOv(); },

    if (KP.type === '支出' && amt > balance()) { toast('餘額不夠喔'); return; }
    closeOv();

    if (KP.type === '支出') kidSay('moneyTip');
  },
  kpdel: function () {

  kptype: function (t) { KP.type = t; refreshOv(); },
  rec: function (id) { openRecord(id); },
  recEdit: function (id) {
    var r = findRec(id);
    if (r) askPin('修改記帳', function () { openKeypad(r.type, r); });
  },
  mpage: function (d) { flipMoney(+d); },
  pin: function (k) {
    var code = pinCode();
    PIN.buf = typeKey(PIN.buf, k, code.length);
    PIN.msg = '';
    PIN.bad = false;
    if (PIN.buf.length === code.length) {
      if (PIN.buf === code) { var cb = PIN.cb; closeOv(); cb(); return; }
      PIN.buf = '';
      PIN.msg = '密碼錯誤，請再試一次';
      PIN.bad = true;
    }
    refreshOv();
  },
  close: function () { closeOv(); },
  sync: function () { manualSync = true; sync(); },
  night: function () {
    S.night = ({ auto: 'on', on: 'off', off: 'auto' })[S.night];
    saveS();
    renderTop();
  },
  reload: function () { location.reload(); },
  theme: function () { openTheme(); },
  setIcon: function (id) {
    S.icon = id;
    saveS();
    refreshOv();
    toast('已開啟 Safari，請點「安裝」');
    window.open(pageBase() + 'profiles/' + id + '.mobileconfig', '_blank');   // 主畫面模式下會跳到 Safari
  },
  talk: function () { S.talk = S.talk === 'off' ? 'on' : 'off'; saveS(); refreshOv(); },
  demoTalk: function () {
    var kinds = [];
    for (var k in KID_LINES) if (KID_LINES.hasOwnProperty(k)) kinds.push(k);
    kidSay(kinds[Math.floor(Math.random() * kinds.length)], '大阪城');
  },
  demoFinish: function () { if (S.pomo) { S.pomo.end = now(); tickPomo(); } else toast('先按「專注 25」開始'); },
  demoReset: function () {
    try { localStorage.removeItem(K('pp_cache')); localStorage.removeItem(K('pp_state')); } catch (e) {}
    location.reload();
  },
  setPomoStyle: function (id) { S.pomoStyle = id; saveS(); renderPomo(); refreshOv(); },
  pstyle: function () {
    var i = 0;
    for (var k = 0; k < POMO_STYLES.length; k++) if (POMO_STYLES[k].id === S.pomoStyle) i = k;
    S.pomoStyle = POMO_STYLES[(i + 1) % POMO_STYLES.length].id;
    saveS();
    renderPomo();
  },
  setTheme: function (id) {
    S.theme = id;
    if (id === 'kid' && S.font !== 'system') S.font = 'naikai';   // 怪盜主題自動搭配俏皮手寫字
    saveS();
    renderAll();
    refreshOv();
  },
  setFont: function (id) { S.font = id; saveS(); renderTop(); refreshOv(); }
};

function onTap(ev) {
  var el = ev.target;
  while (el && el.getAttribute && !el.getAttribute('data-act')) el = el.parentNode;
  if (!el || !el.getAttribute) return;
  var f = ACTS[el.getAttribute('data-act')];
  if (f) f(el.getAttribute('data-arg'));
}

/* iPad 快速連點：手指離開螢幕就立刻執行，不等瀏覽器判斷「點兩下放大」。
   同一顆按鈕連點（例如密碼 0000、喝水點 6 次）才不會漏掉。 */
function flash(el) {
  el.className += ' tapped';
  setTimeout(function () { el.className = el.className.replace(/ tapped/g, ''); }, 160);
}
function fastTap(root) {
  var st = null;
  root.addEventListener('touchstart', function (e) {
    st = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY, t: new Date().getTime() } : null;
  }, false);
  root.addEventListener('touchmove', function (e) {
    if (st && (Math.abs(e.touches[0].clientX - st.x) > 10 || Math.abs(e.touches[0].clientY - st.y) > 10)) st = null;   // 在捲動或滑動
  }, false);
  root.addEventListener('touchend', function (e) {
    var s0 = st;
    st = null;
    if (!s0 || new Date().getTime() - s0.t > 800) return;
    var tag = String(e.target.tagName || '').toUpperCase();
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || tag === 'OPTION' || tag === 'LABEL') return;   // 表單元件交給系統
    var el = e.target;
    while (el && el !== root && el.getAttribute && !el.getAttribute('data-act')) el = el.parentNode;
    if (!el || el === root || !el.getAttribute || !el.getAttribute('data-act')) return;
    e.preventDefault();                 // 擋掉後面那次 click，也不會被當成放大手勢
    flash(el);
    onTap({ target: e.target });
  }, false);
}

/* ================= 啟動 ================= */
/* 依螢幕大小與方向選版面：wide 橫放、tall 直立、narrow 手機等小螢幕（改成上下捲動） */
var LAYOUT = 'wide';
function layoutOf() {
  var w = window.innerWidth, h = window.innerHeight;
  if (w < 600 || h < 480) return 'narrow';
  return w >= h ? 'wide' : 'tall';
}
function bodyClass() {
  return 'th-' + theme().id + ' L-' + LAYOUT + (S.font !== 'system' ? ' f-kid' : '') + (isNight() ? ' night' : '');
}
var lastSize = '';
function fit() {
  var size = window.innerWidth + 'x' + window.innerHeight;
  LAYOUT = layoutOf();
  $('app').style.height = LAYOUT === 'narrow' ? 'auto' : window.innerHeight + 'px';
  document.documentElement.className = LAYOUT === 'narrow' ? 'scroll' : '';
  document.body.className = bodyClass();
  if (size !== lastSize) { lastSize = size; window.scrollTo(0, 0); }
  renderAll();
}
function fitSched() {
  var c = $('cSched'), b = c && c.querySelector('.sbody');
  if (!b) return;
  if (LAYOUT === 'narrow') { c.className = 'card'; return; }
  for (var lv = 0; lv < 4; lv++) {
    c.className = 'card' + (lv ? ' sz' + lv : '');
    if (b.scrollHeight <= b.clientHeight + 1) return;
  }
}
var lastMin = -1, lastDay = ymd(new Date());
function tick() {
  var d = new Date();
  $('time').textContent = hm(d);
  tickPomo();
  tickTasks();
  if (d.getMinutes() !== lastMin) {
    lastMin = d.getMinutes();
    if (ymd(d) !== lastDay) { lastDay = ymd(d); sync(); }
    if (!ovRender) renderAll();
    if (now() - (S.lastSync || 0) > 5 * 60000) sync();
    if (kidOn() && d.getHours() >= 21 && S.sleepTold !== ymd(d)) { S.sleepTold = ymd(d); saveS(); kidSay('sleep'); }
    if (kidOn() && ymd(d).slice(5) === '07-09' && S.bdayTold !== ymd(d)) { S.bdayTold = ymd(d); saveS(); kidSay('bday'); celebrate(false); }
  }
}

$('app').addEventListener('click', onTap, false);
fastTap($('app'));
fastTap($('ov'));
$('rpg').addEventListener('click', rpgTap, false);
fastTap($('rpg'));
/* 零用錢卡片左右滑動 */
(function () {
  var sx = null, sy = 0, card = $('cMoney');
  card.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, false);
  card.addEventListener('touchend', function (e) {

    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) flipMoney(dx < 0 ? 1 : -1);
  }, false);
})();
$('rpgAva').src = KID_IMG.avatars[0];
if (DEMO) {
  var db = $('demoBar');
  db.style.display = 'flex';

    '<span class="dbtn" data-act="demoTalk">測試對話</span><span class="dbtn" data-act="demoFinish">直接飛到終點</span>' +
    '<span class="dbtn" data-act="demoBday">生日</span><span class="dbtn" data-act="demoCard">預告函</span><span class="dbtn" data-act="demoSleep">晚安提醒</span><span class="dbtn" data-act="demoWeek">專注 +3 次</span>' +
    '<span class="dbtn" data-act="demoReset">重置</span>';
  db.addEventListener('click', onTap, false);
  fastTap(db);
}
$('ov').addEventListener('click', onTap, false);
function formSync(e) {
  var el = e.target;
  if (el && el.getAttribute && el.getAttribute('data-score') !== null) { SCORE.v[el.getAttribute('data-score')] = el.value; scoreRefresh(); return; }
  var mf = el && el.getAttribute && el.getAttribute('data-mf');
  if (mf) {
    var tm = /^tier([SR])_(\d+)$/.exec(mf);
    if (tm) MF.tiers[+tm[2]][tm[1] === 'S' ? 0 : 1] = Number(el.value);
    else MF[mf] = el.value;
    if (el.tagName === 'SELECT' && e.type === 'change') refreshOv();
    return;
  }
  if (el && el.getAttribute && el.getAttribute('data-prod') && e.type === 'change') {
    var q = findProd(el.getAttribute('data-prod'));
    if (q) { saveShop(q, Number(el.value) || q.price, q.on); refreshOv(); }
    return;
  }
  if (!el || !el.name || !PF.hasOwnProperty(el.name)) return;
  PF[el.name] = el.name === 'parent' ? el.value === '1' : el.value;
  if (el.name === 'type') { PF.cond = ''; PF.c2 = ''; if (!BONUS_DESC[PF.type]) PF.bonus = '0'; refreshOv(); }
  if (el.name === 'name' && !PF.treasure) {                     // 自動分配的寶物跟著名稱更新
    var opt = document.querySelector('select[name=treasure] option[value=""]');
    if (opt) opt.textContent = '自動分配（目前是：' + taskGem({ name: PF.name, treasure: 0 }).name + '）';
  }
}
$('ov').addEventListener('input', formSync, false);
(function () {                                     // 月曆左右滑動換月份
  var sx = null, sy = 0;
  $('ov').addEventListener('touchstart', function (e) {
    var el = e.target;
    while (el && el.className !== 'mcal' && el !== this) el = el.parentNode;
    sx = el && el.className === 'mcal' ? e.touches[0].clientX : null;
    sy = e.touches[0].clientY;
  }, false);
  $('ov').addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) ACTS.calm(dx < 0 ? 1 : -1);
  }, false);
})();
$('ov').addEventListener('change', formSync, false);
/* 旋轉時 iOS 會晚一點才更新尺寸，所以分兩次檢查 */
var fitTimer = null;
function fitLater() {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(function () { fit(); setTimeout(fit, 500); }, 150);
}
window.addEventListener('resize', fitLater, false);
window.addEventListener('orientationchange', fitLater, false);
window.addEventListener('pageshow', function () { tick(); sync(); }, false);
normAll();
fit();
tick();
setInterval(tick, 1000);
sync();

})();

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>一鍵連線測試</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    padding: 14px 18px; font-size: 17px; color: #222; background: #f2f2f2;
    font-family: -apple-system, "PingFang TC", "Heiti TC", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 22px; margin: 0 0 10px; }
  #go {
    display: block; width: 100%; font-size: 26px; padding: 18px 0; margin: 10px 0 14px;
    border: 0; border-radius: 10px; background: #1565c0; color: #fff; touch-action: manipulation;
  }
  #go:active { background: #0d47a1; }
  #go[disabled] { background: #90a4ae; }
  #summary { font-size: 22px; font-weight: bold; padding: 14px; border-radius: 10px; margin-bottom: 12px; display: none; }
  .s-ok { background: #e8f5e9; color: #1b5e20; }
  .s-fail { background: #ffebee; color: #b71c1c; }
  .row { background: #fff; border: 1px solid #ddd; margin-bottom: 5px; padding: 8px 10px; word-break: break-all; }
  .name { font-weight: bold; }
  .ok { color: #1a7f37; }
  .fail { color: #c62828; }
  .info { color: #555; }
  .small { font-size: 13px; color: #666; }
</style>
</head>
<body>
<h1>一鍵連線測試 <span class="small">v5</span></h1>
<div class="small" id="urlInfo"></div>

<button id="go">開始測試</button>
<div id="summary"></div>
<div id="log"></div>

<script>
/* ================= 只需要改這兩行 ================= */
var API_URL = 'https://script.google.com/macros/s/AKfycbxY-7ZoZfDN-pRjV-p0rnsqRYWrbYpzthbUI_H90c94Zwzg8FIIP0QR-Nq9uzkYH_U2eA/exec';
var API_KEY = 'change-me-1234';
/* ================================================== */

var errors = [];
window.onerror = function (msg, src, line) {
  errors.push(msg + (src ? '｜' + String(src).slice(0, 60) : ''));
  return false;
};

function $(id) { return document.getElementById(id); }
function now() { return new Date().getTime(); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function addRow(name, cls, text) {
  var d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = '<span class="name">' + esc(name) + '</span>　<span class="' + cls + '">' + esc(text) + '</span>';
  $('log').appendChild(d);
}

/* 網址只保留到 /exec，多貼的參數會自動去掉 */
function cleanApi(u) {
  u = String(u || '').replace(/\s+/g, '');
  var i = u.indexOf('/exec');
  return i >= 0 ? u.slice(0, i + 5) : u;
}
var API = cleanApi(API_URL);

var seq = 0;
function buildUrl(params) {
  var q = ['key=' + encodeURIComponent(API_KEY), '_=' + now()];
  for (var k in params) {
    if (params.hasOwnProperty(k)) q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
  }
  return API + '?' + q.join('&');
}

/* 檢查回應是不是新版後端 */
function checkReply(d) {
  if (!d || typeof d !== 'object') return '回應格式不對';
  if (d.app !== 'ipad-panel') return '回應不是新版後端（可能還在跑舊程式）';
  if (!d.ok) return '後端回報：' + d.error;
  return '';
}

/* ---------- 方法 A：JSONP ---------- */
function viaJsonp(params, cb) {
  var name = '__cb' + (++seq) + '_' + now();
  var s = document.createElement('script');
  var done = false;
  var errCount = errors.length;
  var t;
  function finish(err, data) {
    if (done) return;
    done = true;
    clearTimeout(t);
    window[name] = function () {};
    if (s.parentNode) s.parentNode.removeChild(s);
    cb(err, data);
  }
  t = setTimeout(function () {
    var extra = errors.length > errCount ? '（頁面錯誤：' + errors[errors.length - 1] + '）' : '';
    finish('逾時' + extra);
  }, 15000);
  window[name] = function (d) { finish(null, d); };
  s.onerror = function () { finish('載入失敗'); };
  params.callback = name;
  params.mode = 'jsonp';
  s.src = buildUrl(params);
  document.body.appendChild(s);
}

/* ---------- 方法 B：XHR ---------- */
function viaXhr(params, cb) {
  var x = new XMLHttpRequest();
  var done = false;
  function finish(err, data) { if (!done) { done = true; cb(err, data); } }
  params.mode = 'text';
  x.open('GET', buildUrl(params), true);
  x.onload = function () {
    var d = null;
    try { d = JSON.parse(x.responseText); } catch (e) {}
    if (d) finish(null, d);
    else finish('狀態 ' + x.status + '，內容：' + String(x.responseText).replace(/\s+/g, ' ').slice(0, 120));
  };
  x.onerror = function () { finish('被瀏覽器擋下（狀態 ' + x.status + '）'); };
  setTimeout(function () { finish('逾時'); }, 15000);
  x.send();
}

/* ---------- 方法 C：iframe + postMessage ---------- */
function viaFrame(params, cb) {
  var n = 'f' + (++seq) + '_' + now();
  var f = document.createElement('iframe');
  var done = false;
  var t;
  f.style.display = 'none';
  function onMsg(ev) {
    var d = null;
    try { d = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data; } catch (e) { return; }
    if (d && d.n === n) finish(null, d);
  }
  function finish(err, data) {
    if (done) return;
    done = true;
    clearTimeout(t);
    window.removeEventListener('message', onMsg, false);
    if (f.parentNode) f.parentNode.removeChild(f);
    cb(err, data);
  }
  t = setTimeout(function () { finish('逾時'); }, 20000);
  window.addEventListener('message', onMsg, false);
  params.mode = 'frame';
  params.n = n;
  f.src = buildUrl(params);
  document.body.appendChild(f);
}

var METHODS = [
  { key: 'A', name: 'A. JSONP', fn: viaJsonp },
  { key: 'B', name: 'B. XHR', fn: viaXhr },
  { key: 'C', name: 'C. iframe', fn: viaFrame }
];

/* ---------- 主流程 ---------- */
function runAll() {
  $('go').disabled = true;
  $('go').textContent = '測試中，請稍候（最多約 1 分鐘）…';
  $('log').innerHTML = '';
  $('summary').style.display = 'none';
  errors = [];

  addRow('裝置', 'info', navigator.userAgent.replace(/.*CPU OS ([\d_]+).*/, 'iOS $1').replace(/_/g, '.') +
    '｜畫面 ' + window.innerWidth + '×' + window.innerHeight);

  var lsOk = false;
  try { localStorage.setItem('probe', '1'); lsOk = localStorage.getItem('probe') === '1'; } catch (e) {}
  addRow('本地儲存', lsOk ? 'ok' : 'fail', lsOk ? '正常' : '無法使用（請關閉私密瀏覽）');

  if (API.indexOf('https://script.google.com/') !== 0 || API.slice(-5) !== '/exec') {
    addRow('網址', 'fail', '檔案裡的 API_URL 還沒填好：' + API);
    done('fail', '❌ 網址沒有設定好（代碼 URL）');
    return;
  }

  var working = [];
  var i = 0;
  (function next() {
    if (i >= METHODS.length) { afterRead(working); return; }
    var m = METHODS[i++];
    var t0 = now();
    m.fn({ action: 'ping' }, function (err, d) {
      var bad = err || checkReply(d);
      if (bad) {
        addRow(m.name + ' 讀取', 'fail', '失敗：' + bad);
      } else {
        working.push(m);
        addRow(m.name + ' 讀取', 'ok', '成功（' + (now() - t0) + 'ms，伺服器時間 ' + d.serverTime + '）');
      }
      next();
    });
  })();
}

function afterRead(working) {
  if (!working.length) { imgWriteOnly(); return; }
  var m = working[0];
  var id = 'T' + now() + Math.floor(Math.random() * 1000);
  m.fn({ action: 'write', id: id, msg: 'iPad 一鍵測試' }, function (err, d1) {
    var bad = err || checkReply(d1);
    if (bad) {
      addRow('寫入', 'fail', '失敗：' + bad);
      done('fail', '⚠️ 可以讀取，但寫入失敗（代碼 ' + m.key + '-W）');
      return;
    }
    m.fn({ action: 'write', id: id, msg: '重送' }, function (err2, d2) {
      var dupOk = !err2 && d2 && d2.duplicate === true && d1.duplicate === false;
      addRow('寫入', dupOk ? 'ok' : 'fail', dupOk ? '成功，重複送出也只會記一筆' : '去重異常');
      var names = [];
      for (var j = 0; j < working.length; j++) names.push(working[j].key);
      done(dupOk ? 'ok' : 'fail', (dupOk ? '✅ 連網正常！' : '⚠️ 部分正常，') +
        '可用方法：' + names.join('、') + '（代碼 OK-' + names.join('') + '）');
    });
  });
}

/* 讀取全部失敗時：用圖片請求試試看能不能「只寫入」 */
function imgWriteOnly() {
  var id = 'IMG' + now();
  var img = new Image();
  img.onload = img.onerror = function () {
    addRow('D. 圖片寫入', 'info', '已送出。請打開試算表的 Test 分頁，看有沒有 ' + id + ' 這一列');
    var tail = errors.length ? '｜頁面錯誤：' + errors[errors.length - 1] : '';
    done('fail', '❌ 三種讀取方法都失敗（代碼 FAIL）' + tail);
  };
  img.src = buildUrl({ action: 'write', id: id, msg: '圖片寫入', mode: 'img' });
}

function done(cls, text) {
  var s = $('summary');
  s.className = cls === 'ok' ? 's-ok' : 's-fail';
  s.textContent = text;
  s.style.display = 'block';
  $('go').disabled = false;
  $('go').textContent = '再測一次';
}

$('urlInfo').textContent = '目前使用的網址：' + (API.length > 70 ? API.slice(0, 55) + '…' + API.slice(-15) : API);
$('go').onclick = runAll;
</script>
</body>
</html>
